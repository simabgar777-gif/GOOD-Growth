<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pk-bg:#0A0B0D; --pk-panel:#101114; --pk-panel2:#14161A; --pk-line:rgba(236,226,206,.10);
    --pk-ink:#F4F1EA; --pk-mut:#8A857C; --pk-copper:#E8A54F; --pk-copper-lt:#F3C583;
    --pk-ok:#8ED08A; --pk-warn:#E0A46A;
  }
  .pk-wrap{max-width:1180px;margin:0 auto;padding:30px 26px 90px}
  .pk-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .pk-kick{font:500 10.5px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--pk-copper);margin:0 0 10px}
  h1.pk-h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:32px;margin:0 0 6px;color:var(--pk-ink)}
  .pk-sub{margin:0;color:var(--pk-mut);font-size:13.5px}
  .pk-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--pk-line);background:var(--pk-panel);color:#CFC9BD;
    border-radius:10px;padding:9px 14px;font-size:12.5px;cursor:pointer;text-decoration:none}

  /* строка статуса */
  .pk-strip{display:grid;grid-template-columns:1.15fr 1fr 1fr 1.1fr;gap:0;border:1px solid var(--pk-line);border-radius:16px;
    background:linear-gradient(180deg,#111216,#0D0E11);margin-bottom:26px;overflow:hidden}
  .pk-cell{padding:16px 20px;border-right:1px solid var(--pk-line)}
  .pk-cell:last-child{border-right:0}
  .pk-lbl{font:500 9.5px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#6F6A61;margin:0 0 8px}
  .pk-val{font-size:17px;color:var(--pk-ink);display:flex;align-items:center;gap:8px}
  .pk-val small{color:var(--pk-mut);font-size:12px}
  .pk-chip{font-size:11px;border-radius:999px;padding:3px 9px;border:1px solid rgba(142,208,138,.35);color:var(--pk-ok);background:rgba(142,208,138,.08)}
  .pk-chip.off{border-color:rgba(224,164,106,.35);color:var(--pk-warn);background:rgba(224,164,106,.08)}
  .pk-bar{height:7px;border-radius:99px;background:#191B20;overflow:hidden;margin-top:10px}
  .pk-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E8A54F,#F3C583);transition:width .4s}

  /* сетка: слева дерево, справа карточки */
  .pk-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
  .pk-canvas{border:1px solid var(--pk-line);border-radius:18px;background:radial-gradient(120% 80% at 50% 0%,rgba(232,165,79,.07),transparent 60%),#0C0D10;
    padding:26px 22px 22px;position:relative;min-height:360px}
  .pk-owner{width:230px;margin:0 auto;border:1px solid rgba(232,165,79,.45);border-radius:16px;background:linear-gradient(180deg,#15161A,#101114);
    padding:18px 16px 16px;text-align:center;position:relative;box-shadow:0 18px 40px -22px rgba(232,165,79,.5)}
  .pk-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font:600 9px/1 'JetBrains Mono',monospace;letter-spacing:.14em;
    text-transform:uppercase;color:#1B1206;background:linear-gradient(180deg,#F0BC72,#E8A54F);border-radius:999px;padding:5px 12px}
  .pk-ava{width:62px;height:62px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;
    background:linear-gradient(160deg,#3A2A17,#221A10);border:1px solid rgba(232,165,79,.35);color:var(--pk-copper-lt);
    font:600 20px/1 'Playfair Display',Georgia,serif}
  .pk-name{font-size:15.5px;color:var(--pk-ink);margin:0 0 3px}
  .pk-role{font-size:11.5px;color:var(--pk-copper);margin:0 0 10px}
  .pk-code{font:500 12px/1 'JetBrains Mono',monospace;color:#CFC9BD;background:#0E0F12;border:1px solid var(--pk-line);border-radius:8px;padding:7px 10px;display:inline-block}
  .pk-line{position:absolute;left:50%;top:246px;width:1px;height:26px;background:linear-gradient(180deg,rgba(232,165,79,.6),rgba(232,165,79,.15))}
  .pk-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:52px;position:relative}
  .pk-kid{border:1px solid var(--pk-line);border-radius:14px;background:var(--pk-panel);padding:14px;text-align:center}
  .pk-kid .n{font-size:12.5px;color:var(--pk-ink);margin:0 0 4px}
  .pk-kid .s{font-size:11px;color:var(--pk-mut)}
  .pk-kid.empty{border-style:dashed;background:transparent}
  .pk-kid .plus{width:30px;height:30px;border-radius:50%;border:1px solid var(--pk-line);display:grid;place-items:center;margin:0 auto 8px;color:var(--pk-copper)}

  .pk-side{display:flex;flex-direction:column;gap:14px}
  .pk-card{border:1px solid var(--pk-line);border-radius:14px;background:var(--pk-panel);padding:16px 18px}
  .pk-card h3{margin:0 0 4px;font-size:13.5px;color:var(--pk-ink);display:flex;align-items:center;gap:8px}
  .pk-card p{margin:0;color:var(--pk-mut);font-size:12.5px;line-height:1.55}
  .pk-card .ic{color:var(--pk-copper)}

  .pk-bottom{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
  .pk-table{width:100%;border-collapse:collapse;font-size:13px}
  .pk-table td{padding:9px 0;border-bottom:1px solid rgba(236,226,206,.06);color:#CFC9BD}
  .pk-table td:first-child{color:var(--pk-mut)}
  .pk-table td:last-child{text-align:right;color:var(--pk-ink)}
  .pk-table tr:last-child td{border-bottom:0}
  .pk-act{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(236,226,206,.06);color:#CFC9BD;
    text-decoration:none;font-size:13.5px}
  .pk-act:last-child{border-bottom:0}
  .pk-act:hover{color:var(--pk-copper-lt)}
  .pk-act .ic{color:var(--pk-copper);flex:none}
  .pk-act .arr{margin-left:auto;color:#6F6A61}
  .pk-say{margin:16px 0 0;font-size:12.5px;color:var(--pk-copper-lt);min-height:18px}
  .pk-join{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .pk-btn{border:0;border-radius:10px;padding:12px 20px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
    background:linear-gradient(180deg,#F0BC72,#E8A54F 55%,#DF9A48);color:#1B1206}
  .pk-btn.ghost{background:transparent;border:1px solid var(--pk-line);color:#CFC9BD;font-weight:500}
  .pk-load{color:var(--pk-mut);font-size:13px}

  /* лестница уровней */
  .pk-ladder{margin:0 0 22px}
  .pk-ladder-top{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .pk-ladder-top .t{font:500 9.5px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#6F6A61}
  .pk-ladder-top .h{margin-left:auto;font-size:12px;color:var(--pk-copper-lt)}
  .pk-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative;
    border:1px solid var(--pk-line);border-radius:16px;background:linear-gradient(180deg,#101216,#0C0D10);overflow:hidden}
  .pk-step{position:relative;padding:16px 18px 14px;text-align:left;border-right:1px solid var(--pk-line)}
  .pk-step:last-child{border-right:0}
  .pk-step .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin:0 8px 0 0;vertical-align:middle;
    border:1.5px solid #4A463F;background:transparent}
  .pk-step .nm{font-size:14px;color:#7C776E;vertical-align:middle}
  .pk-step .cond{display:block;margin:7px 0 0;font-size:11.5px;color:#6F6A61}
  .pk-step .rate{display:block;margin:3px 0 0;font:500 11px/1 'JetBrains Mono',monospace;color:#6F6A61}
  /* пройден */
  .pk-step.done .dot{background:rgba(232,165,79,.55);border-color:rgba(232,165,79,.7)}
  .pk-step.done .nm{color:#CFC9BD}
  /* текущий */
  .pk-step.cur{background:linear-gradient(180deg,rgba(232,165,79,.10),rgba(232,165,79,.03))}
  .pk-step.cur .dot{background:var(--pk-copper);border-color:var(--pk-copper);box-shadow:0 0 0 4px rgba(232,165,79,.14)}
  .pk-step.cur .nm{color:var(--pk-ink);font-weight:600}
  .pk-step.cur .rate{color:var(--pk-copper)}
  .pk-step.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#E8A54F,#F3C583)}
  /* следующий */
  .pk-step.next .dot{border-color:#6E675C}
  .pk-step.next .nm{color:#B7B1A6}
  .pk-step.next .cond{color:var(--pk-copper-lt)}
  @media (max-width:760px){ .pk-steps{grid-template-columns:1fr} .pk-step{border-right:0;border-bottom:1px solid var(--pk-line)} .pk-step:last-child{border-bottom:0} }
  @media (max-width:980px){ .pk-grid,.pk-bottom{grid-template-columns:1fr} .pk-strip{grid-template-columns:1fr 1fr} .pk-cell:nth-child(2){border-right:0} }
</style>
</head>

<div class="pk-wrap">
  <div class="pk-head">
    <div>
      <p class="pk-kick">GOOD Growth · партнёрам</p>
      <h1 class="pk-h1">Партнёрский кабинет</h1>
      <p class="pk-sub">твоя ссылка, уровень и начисления — без звёздочек</p>
    </div>
    <a class="pk-toggle" href="/partner/program">Условия программы</a>
  </div>

  <div id="pkLadder"></div>
  <div id="pkRoot"><p class="pk-load">Загружаю…</p></div>
</div>

<script>
(function () {
  var root = document.getElementById('pkRoot');
  var NAMES = { start: 'Старт', growth: 'Рост', pro: 'Про', agency: 'Агентство', unlimited: 'Безлимит' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function money(n) {
    var v = Math.round(Number(n || 0) * 100) / 100;
    var s = v.toFixed(2).replace(/\.00$/, '');
    var p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return p.join(',');
  }
  function dateRu(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; }
  }


  var STEPS = [
    { key: 'friend',     title: 'Друг',      need: 0,  cond: 'сразу после вступления', rate: '25% · до 500 ₽' },
    { key: 'guide',      title: 'Проводник', need: 10, cond: '10 оплативших клиентов', rate: '35% · до 700 ₽' },
    { key: 'ambassador', title: 'Посол',     need: 50, cond: '50 оплативших клиентов', rate: '45% · до 900 ₽' }
  ];

  function ladder(p) {
    var paid = Number(p.paid_clients || 0);
    var html = '<div class="pk-ladder"><div class="pk-ladder-top">' +
      '<span class="t">Твой путь</span>' +
      (p.next_title
        ? '<span class="h">до «' + esc(p.next_title) + '» — ' + p.to_next + ' ' + (p.to_next === 1 ? 'клиент' : (p.to_next < 5 ? 'клиента' : 'клиентов')) + '</span>'
        : '<span class="h">ты на вершине</span>') +
      '</div><div class="pk-steps">';
    for (var i = 0; i < STEPS.length; i++) {
      var st = STEPS[i];
      var cls = '';
      if (st.key === p.level) cls = 'cur';
      else if (paid >= st.need && st.need > 0) cls = 'done';
      else if (p.next_title && st.key === levelKeyForNext(p.next_title)) cls = 'next';
      html += '<div class="pk-step ' + cls + '">' +
        '<span class="dot"></span><span class="nm">' + st.title + '</span>' +
        '<span class="cond">' + st.cond + '</span>' +
        '<span class="rate">' + st.rate + '</span>' +
      '</div>';
    }
    html += '</div></div>';
    return html;
  }

  function levelKeyForNext(title) {
    if (!title) return '';
    if (title.indexOf('Проводник') === 0) return 'guide';
    if (title.indexOf('Посол') === 0) return 'ambassador';
    return '';
  }

  function strip(p) {
    var need = p.next_title ? (p.paid_clients + p.to_next) : Math.max(p.paid_clients, 1);
    var prog = Math.min(100, Math.round((p.paid_clients / Math.max(1, need)) * 100));
    return '<div class="pk-strip">' +
      '<div class="pk-cell"><p class="pk-lbl">Твой уровень</p>' +
        '<div class="pk-val">' + esc(p.title) + ' <small>' + p.rate + '% · до ' + p.cap + ' ₽</small></div></div>' +
      '<div class="pk-cell"><p class="pk-lbl">Статус</p>' +
        '<div class="pk-val"><span class="pk-chip">партнёр активен</span></div></div>' +
      '<div class="pk-cell"><p class="pk-lbl">Копится к выплате</p>' +
        '<div class="pk-val">' + money(p.pending_rub) + ' ₽ <small>из 1 000 ₽</small></div></div>' +
      '<div class="pk-cell"><p class="pk-lbl">Клиентов оплатили</p>' +
        '<div class="pk-val">' + p.paid_clients +
          (p.next_title ? ' <small>до «' + esc(p.next_title) + '» — ' + p.to_next + '</small>' : ' <small>высший уровень</small>') +
        '</div><div class="pk-bar"><i style="width:' + prog + '%"></i></div></div>' +
    '</div>';
  }

  function canvas(p) {
    var kids = '';
    var n = Number(p.paid_clients || 0);
    var show = Math.min(n, 6);
    for (var i = 1; i <= show; i++) {
      kids += '<div class="pk-kid"><p class="n">Клиент №' + i + '</p><p class="s">оплатил · считается</p></div>';
    }
    kids += '<div class="pk-kid empty"><div class="plus">+</div>' +
      '<p class="n">Пока никого</p><p class="s">делись ссылкой — тут появятся клиенты</p></div>';

    return '<div class="pk-canvas">' +
      '<div class="pk-owner">' +
        '<span class="pk-badge">' + esc(p.title) + '</span>' +
        '<div class="pk-ava">GO</div>' +
        '<p class="pk-name">' + esc(p.name || 'Партнёр GOOD') + '</p>' +
        '<p class="pk-role">' + p.rate + '% · до ' + p.cap + ' ₽ за клиента</p>' +
        '<span class="pk-code">' + esc(p.code) + '</span>' +
      '</div>' +
      '<div class="pk-line"></div>' +
      '<div class="pk-kids">' + kids + '</div>' +
    '</div>';
  }

  function side(p) {
    return '<div class="pk-side">' +
      '<div class="pk-card"><h3><span class="ic">◈</span> Что даёт уровень</h3>' +
        '<p>Ставка ' + p.rate + '% с каждого платежа клиента, но не больше ' + p.cap + ' ₽ за клиента в месяц. ' +
        (p.months ? 'Выплаты ' + p.months + ' месяцев с первой оплаты клиента.' : 'Выплаты пожизненно, пока клиент платит.') +
        '</p></div>' +
      '<div class="pk-card"><h3><span class="ic">⧗</span> Честное время</h3>' +
        '<p>Холд 30 дней на возвраты, выплата до 5 числа. Порог — 1 000 ₽. Первые деньги приходят примерно через 1–1,5 месяца после оплаты клиента.</p></div>' +
      '<div class="pk-card"><h3><span class="ic">◉</span> Твоя ссылка</h3>' +
        '<p style="word-break:break-all">' + esc(p.link) + '</p>' +
        '<div class="pk-join"><button type="button" class="pk-btn" id="pkCopy">Скопировать</button></div></div>' +
    '</div>';
  }

  function bottom(p) {
    return '<div class="pk-bottom">' +
      '<div class="pk-card"><h3>Детали</h3><table class="pk-table">' +
        '<tr><td>Уровень</td><td>' + esc(p.title) + '</td></tr>' +
        '<tr><td>Ставка</td><td>' + p.rate + '%</td></tr>' +
        '<tr><td>Потолок за клиента</td><td>' + p.cap + ' ₽ / мес</td></tr>' +
        '<tr><td>Переходов по ссылке</td><td>' + p.clicks + '</td></tr>' +
        '<tr><td>Регистраций</td><td>' + p.signups + '</td></tr>' +
        '<tr><td>Оплатили</td><td>' + p.paid_clients + '</td></tr>' +
        '<tr><td>Копится</td><td>' + money(p.pending_rub) + ' ₽</td></tr>' +
        '<tr><td>Уже выплачено</td><td>' + money(p.paid_rub) + ' ₽</td></tr>' +
      '</table></div>' +
      '<div class="pk-card"><h3>Быстрые действия</h3>' +
        '<a class="pk-act" href="#" id="pkCopy2"><span class="ic">⧉</span> Скопировать ссылку <span class="arr">›</span></a>' +
        '<a class="pk-act" href="/partner/program"><span class="ic">◈</span> Условия программы <span class="arr">›</span></a>' +
        '<a class="pk-act" href="/partner/info"><span class="ic">◇</span> Как это работает <span class="arr">›</span></a>' +
        '<a class="pk-act" href="mailto:hello@go-ood.com"><span class="ic">✉</span> Написать нам <span class="arr">›</span></a>' +
      '</div>' +
    '</div>';
  }

  function wireCopy(p) {
    function copy(e) {
      if (e) e.preventDefault();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(p.link);
        else { var t = document.createElement('textarea'); t.value = p.link; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
        var say = document.getElementById('pkSay');
        if (say) say.textContent = 'Ссылка скопирована';
        setTimeout(function () { if (say) say.textContent = ''; }, 2000);
      } catch (err) {}
    }
    ['pkCopy', 'pkCopy2'].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.addEventListener('click', copy);
    });
  }

  function joinState(note) {
    var host = document.getElementById('pkLadder');
    if (host) host.innerHTML = '';
    root.innerHTML = '<div class="pk-card" style="max-width:560px">' +
      '<h3>Стать партнёром</h3>' +
      '<p>' + esc(note || 'Включи участие — получишь код и ссылку сразу. Ставка 25%, до 500 ₽ за клиента.') + '</p>' +
      '<div class="pk-join"><button type="button" class="pk-btn" id="pkJoin">Включить участие</button>' +
      '<a class="pk-btn ghost" href="/partner/program">Условия</a></div>' +
      '<p class="pk-say" id="pkSay"></p></div>';
    var b = document.getElementById('pkJoin');
    b.addEventListener('click', function () {
      b.disabled = true;
      fetch('/api/partner/join', { method: 'POST', credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) {
            if (res.j && res.j.needAuth) { location.href = '/login?next=/partner/cabinet'; return; }
            document.getElementById('pkSay').textContent = (res.j && res.j.error) || 'Не получилось.';
            b.disabled = false; return;
          }
          load();
        })
        .catch(function () { b.disabled = false; document.getElementById('pkSay').textContent = 'Сервер не отвечает.'; });
    });
  }

  function paint(p) {
    var host = document.getElementById('pkLadder');
    if (host) host.innerHTML = ladder(p);
    root.innerHTML = strip(p) + '<div class="pk-grid">' + canvas(p) + side(p) + '</div>' + bottom(p) +
      '<p class="pk-say" id="pkSay"></p>';
    wireCopy(p);
  }

  function load() {
    fetch('/api/partner/me', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : { ready: false }; })
      .then(function (d) {
        if (!d || !d.ready || !d.partner) { joinState(d && d.note); return; }
        paint(d.partner);
      })
      .catch(function () { root.innerHTML = '<p class="pk-load">Не удалось загрузить кабинет. Обнови страницу.</p>'; });
  }

  load();
})();
</script>

<script src="/theme.js" defer></script>
<script src="/topline.js" defer></script>
<script src="/rail.js" defer></script>
<script src="/legal.js" defer></script>
</body>
</html>

<div class="wrap">
<h1>Партнёрский кабинет</h1>
<p class="sub">твоя ссылка, переходы и начисления — без звёздочек</p>

<div id="pcRoot"><p class="pc-load">Загружаю…</p></div>

<script>
(function () {
  var root = document.getElementById('pcRoot');
  function money(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  fetch('/api/partner/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : { ready: false }; })
    .then(function (d) {
      if (!d || !d.ready || !d.partner) {
        root.innerHTML =
          '<div class="pc-empty">' +
            '<h2>Ты пока не партнёр</h2>' +
            '<p>' + (d && d.note ? d.note : 'Напиши нам — обсудим условия и откроем кабинет.') + '</p>' +
            '<div class="pc-acts">' +
              '<a class="pr-go" href="mailto:hello@growth.go-ood.com?subject=Партнёрство">Написать нам</a>' +
              '<a class="step-go ghost" href="/partner/info">Как это работает</a>' +
            '</div>' +
          '</div>';
        return;
      }
      var p = d.partner;
      root.innerHTML =
        '<section class="pc-link">' +
          '<p class="pr-lbl">твоя ссылка · код ' + p.code + '</p>' +
          '<div class="pc-link-row">' +
            '<input id="pcLink" readonly value="' + p.link + '">' +
            '<button type="button" class="pr-go" id="pcCopy">Скопировать</button>' +
          '</div>' +
          '<p class="pc-hint" id="pcHint">Код живёт 30 дней после перехода. Начисления — ' +
            p.rate + '% в течение ' + p.months + ' месяцев.</p>' +
        '</section>' +
        '<div class="pc-stats">' +
          '<div class="pc-stat"><b>' + p.clicks + '</b><span>переходов</span></div>' +
          '<div class="pc-stat"><b>' + p.signups + '</b><span>регистраций</span></div>' +
          '<div class="pc-stat"><b>' + p.paid + '</b><span>оплатили</span></div>' +
          '<div class="pc-stat"><b>' + money(p.earned) + ' ₽</b><span>начислено</span></div>' +
        '</div>' +
        '<div class="pr-honest">' +
          '<b>Честно:</b> ' + (d.note || 'оплаты пока не подключены.') +
          ' Переходы и регистрации уже считаются, деньги — когда включим платежи.' +
        '</div>';

      var btn = document.getElementById('pcCopy');
      btn.addEventListener('click', function () {
        var inp = document.getElementById('pcLink');
        inp.select();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(inp.value).catch(function () {
              try { document.execCommand('copy'); } catch (e) {}
            });
          } else {
            try { document.execCommand('copy'); } catch (e) {}
          }
          btn.textContent = 'Скопировано';
          setTimeout(function () { btn.textContent = 'Скопировать'; }, 1600);
        } catch (e) {}
      });
    })
    .catch(function () {
      root.innerHTML = '<p class="pc-load">Не удалось загрузить кабинет. Обнови страницу.</p>';
    });
})();
</script>
</div>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
<script>(function(){try{var t=localStorage.getItem("gg_theme")||"dark";var d=document.documentElement;if(t==="system"){d.setAttribute("data-theme-src","system");}else{d.setAttribute("data-theme",t==="light"?"light":"dark");}}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <title data-i18n="forgot.meta.title">Восстановление пароля — GOOD Growth</title>
  <link rel="stylesheet" href="/style-c.css"><link rel="stylesheet" href="/theme.css">
  <style>
  *{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#08090A;color:#F4F4F5}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 40px;background:linear-gradient(180deg,#0B0C0E,#08090A)}
.box{width:100%;max-width:430px;text-align:left}
.mhead{text-align:center;margin-bottom:6px}
.mhead h1{font-size:27px;margin-bottom:10px;letter-spacing:-.01em;color:#F4F4F5}
.mhead .sub{text-align:center;color:#A1A1AA;font-size:15.5px;margin:0}
form{margin-top:24px;display:flex;flex-direction:column;gap:12px;text-align:left}
label{font-size:13.5px;font-weight:700;color:#C9C9D1}
input{width:100%;padding:12px 14px;border:1px solid rgba(232,165,79,.28);border-radius:10px;font:inherit;font-size:15px;background:#111216;color:#F4F4F5}
input::placeholder{color:#5F626B}
.pw-wrap{display:block;position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;color:#E8A54F;padding:4px;line-height:0;border-radius:8px;transition:color 150ms linear}
.pw-eye:hover,.pw-eye:focus-visible{color:#F3C583}
.pw-eye svg{width:20px;height:20px}
.pw-eye .off-i{display:none}
.pw-eye.on .on-i{display:none}
.pw-eye.on .off-i{display:block}
button.pw-eye,button.pw-eye:hover,button.pw-eye:active,button.pw-eye:focus{transform:translateY(-50%) !important}
input[type="password"]::-ms-reveal,input[type="password"]::-ms-clear{display:none !important;height:0;width:0}
input:focus{outline:none;border-color:rgba(232,165,79,.65);background:#0E0F12;box-shadow:0 0 0 3px rgba(232,165,79,.15)}
button.btn{margin-top:6px;background:linear-gradient(180deg,#F0BC72,#E8A54F 55%,#DF9A48);color:#1B1206;font-weight:700;font-size:15px;padding:12px 22px;border:1px solid rgba(255,255,255,.16);border-radius:10px;cursor:pointer;font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 10px 26px -10px rgba(232,165,79,.55);transition:transform 150ms cubic-bezier(.22,1,.36,1)}
button.btn:hover{background:linear-gradient(180deg,#F7C987,#EDAB5D 55%,#E8A54F);transform:translateY(-1px)}
button.btn:disabled{opacity:.6;cursor:wait;transform:none}
.msg{margin-top:14px;font-size:14.5px;border-radius:10px;padding:10px 14px;display:none;text-align:left}
.msg.err{display:block;background:rgba(232,105,79,.10);color:#E88A6F;border:1px solid rgba(232,105,79,.30)}
.msg.ok{display:block;background:rgba(232,165,79,.08);color:#F3C583;border:1px solid rgba(232,165,79,.25)}
.alt{margin-top:18px;font-size:14px;color:#A1A1AA;text-align:center}
.alt a{color:#E8A54F;font-weight:600;text-decoration:none}
.alt a:hover{text-decoration:underline}
.hint{font-size:12.5px;color:#8B8B95;margin-top:3px}
.hint.bad{color:#E88A6F;font-weight:700}
@media (max-width:480px){.wrap{padding:28px 18px}.mhead h1{font-size:23px}}
  </style>
</head>
<body>
<script src="/i18n/i18n.js"></script>
<div class="wrap"><div class="box">
  <div class="mhead">
    <h1 data-i18n="forgot.h1">Восстановление пароля</h1>
    <p class="sub" data-i18n="forgot.sub">Укажи email — отправим ссылку для сброса пароля.</p>
  </div>
  <form id="fpForm" novalidate>
    <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><div class="hint" data-i18n="forgot.hint">Ссылка живёт 1 час.</div></div>
    <button class="btn" type="submit" id="fpBtn" data-i18n="forgot.submit">Отправить ссылку для сброса</button>
  </form>
  <p class="alt"><span data-i18n="forgot.back.q">Вспомнил пароль?</span> <a href="/login" data-i18n="forgot.back.a">Войти</a></p>
  <div class="msg" id="msg"></div>
</div></div>
<script>
(function(){
  var f=document.getElementById('fpForm'),m=document.getElementById('msg'),b=document.getElementById('fpBtn');
  function show(t,ok){m.className='msg '+(ok?'ok':'err');m.textContent=t;}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    m.className='msg';m.textContent='';
    var email=f.email.value.trim();
    if(!email){show(ggT('forgot.msg.email','Укажи email.'),false);return;}
    b.disabled=true;
    fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
      .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
      .then(function(res){
        if(res.status===200){
          f.reset();
          var extra = res.d.delivered==='telegram' ? ggT('forgot.msg.tg',' Ссылка также отправлена в Telegram — проверь чат GOOD Growth.') : '';
          show(ggT('forgot.msg.ok','Проверь почту: мы отправили ссылку для сброса пароля на {email}.{extra} Письмо не пришло за 5 минут — напиши на hello@growth.go-ood.com').replace('{email}',res.d.email).replace('{extra}',extra),true);
        } else {
          b.disabled=false;
          show((res.d&&res.d.error)||ggT('forgot.msg.fail','Не получилось. Попробуй ещё раз.'),false);
        }
      })
      .catch(function(){b.disabled=false;show(ggT('common.msg.nonet','Сервер не отвечает. Попробуй ещё раз.'),false);});
  });
})();
</script>
<script src="/gg-header.js" defer></script>
<script src="/theme.js" defer></script>
</body>
</html>

<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem("gg_theme")||"dark";var d=document.documentElement;if(t==="system"){d.setAttribute("data-theme-src","system");}else{d.setAttribute("data-theme",t==="light"?"light":"dark");}}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="profile.meta.title">Профиль — GOOD Growth</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<style>
  :root{--pg-bg:#08090A;--pg-surface:#0E0F12;--pg-surface2:#111216;--pg-line:rgba(255,255,255,.06);--pg-line2:rgba(255,255,255,.10);--pg-fg:#F4F4F5;--pg-fg2:#A1A1AA;--pg-fg3:#8B8B95;--pg-copper:#E8A54F;--pg-copper-lt:#F3C583;--pg-grad:linear-gradient(180deg,#F0BC72,#E8A54F 55%,#DF9A48);--pg-ink:#1B1206}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--pg-bg);color:var(--pg-fg);padding:24px 24px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  .card{background:var(--pg-surface);border:1px solid var(--pg-line2);border-radius:12px;padding:28px 30px}
  .hero{display:flex;align-items:center;gap:20px;margin-bottom:22px}
  .avatar{width:72px;height:72px;border-radius:50%;background:var(--pg-grad);color:var(--pg-ink);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex-shrink:0}
  .hero h1{font-size:24px;letter-spacing:-.01em}
  .hero .mail{color:var(--pg-fg2);font-size:15px}
  .hero .since{color:var(--pg-fg3);font-size:13px}
  h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-copper);margin:26px 0 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card h3{font-size:16.5px;margin-bottom:8px}
  .mut{color:var(--pg-fg2);font-size:14px}
  .tiny{color:var(--pg-fg3);font-size:12.5px}
  .badge{display:inline-block;background:rgba(232,165,79,.12);color:var(--pg-copper-lt);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid rgba(232,165,79,.3)}
  .bar{height:8px;background:rgba(255,255,255,.06);border-radius:99px;margin:6px 0 10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pg-grad);border-radius:99px}
  .blist{display:flex;flex-direction:column;gap:8px}
  .bitem{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--pg-line2);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--pg-fg);font-weight:600;font-size:14.5px;transition:border-color .15s ease}
  .bitem span:first-child{display:flex;align-items:center;gap:9px}
  .dotc{width:10px;height:10px;border-radius:50%;background:var(--pg-copper);flex-shrink:0}
  .bitem:hover{border-color:rgba(232,165,79,.45)}
  .trow{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.5px}
  .trow b{font-weight:700}
  .rolechip{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .rc-owner{background:rgba(232,165,79,.14);color:var(--pg-copper-lt)}
  .rc-approver{background:rgba(255,255,255,.05);color:var(--pg-fg2)}
  .rc-publisher{background:rgba(232,165,79,.08);color:var(--pg-copper)}
  .rc-creator{background:rgba(255,255,255,.04);color:var(--pg-fg3)}
  .rc-pending{background:rgba(232,180,79,.10);color:var(--pg-copper-lt)}
  button,.btn{background:var(--pg-grad);color:var(--pg-ink);font-weight:700;font-size:14px;padding:10px 18px;border:1px solid rgba(255,255,255,.16);border-radius:8px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;transition:box-shadow .2s ease,transform 150ms cubic-bezier(.22,1,.36,1)}
  button:hover:not(:disabled),.btn:hover{box-shadow:0 10px 26px -10px rgba(232,165,79,.55);transform:translateY(-1px)}
  button:active:not(:disabled),.btn:active{transform:translateY(0) scale(.992)}
  button.ghost,.btn.ghost{background:rgba(255,255,255,.032);color:var(--pg-fg2);border:1px solid var(--pg-line2);box-shadow:none}
  button.ghost:hover:not(:disabled),.btn.ghost:hover{color:var(--pg-fg);border-color:rgba(232,165,79,.45);box-shadow:none;transform:none}
  button:disabled{opacity:.6;cursor:wait}
  input,select{width:100%;padding:10px 13px;border:1px solid var(--pg-line2);border-radius:8px;font:inherit;font-size:14.5px;background:var(--pg-surface2);color:var(--pg-fg)}
  input:focus,select:focus{outline:none;border-color:rgba(232,165,79,.55);box-shadow:0 0 0 3px rgba(232,165,79,.14)}
  label{font-size:12.5px;font-weight:700;color:var(--pg-fg3);display:block;margin:10px 0 4px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .status{font-size:13.5px;margin-top:8px;display:none;border-radius:9px;padding:8px 12px}
  .status.err{display:block;background:rgba(232,105,79,.10);color:#E88A6F}
  #pwHint.bad{color:#E88A6F;font-weight:700}
  .status.ok{display:block;background:rgba(232,165,79,.10);color:var(--pg-copper-lt)}
  .hist{list-style:none}
  .hist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--pg-line);font-size:14px}
  .hist li:last-child{border-bottom:0}
  .hist .d{color:var(--pg-fg3);font-size:12.5px;white-space:nowrap}
  .empty{color:var(--pg-fg3);font-size:14px;border:1px dashed var(--pg-line2);border-radius:12px;padding:16px;text-align:center}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start;gap:12px}.frow{grid-template-columns:1fr}.card{padding:22px 18px}}</style>

an data-i18n="rail.channels">Каналы</span></a><a href="/app/analytics" data-k="analytics"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5h11"/><path d="M4.5 12.5V8M8 12.5V4.2M11.5 12.5V9.6"/></svg><span data-i18n="rail.analytics">Аналитика</span></a><a href="/partner/team" data-k="team"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.8" cy="6.2" r="2"/><circle cx="11.2" cy="7" r="1.5"/><path d="M2.6 13.2c0-2 1.5-3.1 3.2-3.1s3.2 1.1 3.2 3.1"/><path d="M10.1 13.2c0-1.5.9-2.4 2.1-2.4s2.1.9 2.1 2.4"/></svg><span data-i18n="rail.team">Команда</span></a><a href="/partner/info" data-k="partners"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="8" r="1.7"/><circle cx="12" cy="4.6" r="1.7"/><circle cx="12" cy="11.4" r="1.7"/><path d="M5.5 7.3l4.9-2M5.5 8.7l4.9 2"/></svg><span data-i18n="rail.partners">Партнёрам</span></a><a href="/app/billing" data-k="billing"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="3.8" width="12.4" height="8.4" rx="1.6"/><path d="M1.8 6.8h12.4"/><path d="M4.5 9.8h3"/></svg><span data-i18n="rail.billing">Оплата</span></a></nav><div class="gg-rail-foot"><a href="/profile" data-k="profile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg><span data-i18n="rail.settings">Настройки</span></a><button type="button" class="gg-rail-theme" id="ggRailTheme"><span class="gg-ico">☾</span><span class="gg-tx" data-i18n="rail.theme.dark">Тёмная</span></button><button type="button" class="gg-rail-out" id="ggRailOut" data-i18n="rail.logout">Выйти</button></div></aside>

<div class="wrap">
  <div class="card" id="root"><p class="mut">Загружаю профиль…</p></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var PLAN_NAMES={start:ggT('plan.start','Старт'),growth:ggT('plan.growth','Рост'),pro:ggT('plan.pro','Про'),agency:ggT('plan.agency','Агентство'),unlimited:ggT('plan.unlimited','Безлимит')};
  var ROLE_NAMES={owner:ggT('role.owner','Владелец'),approver:ggT('role.approver','Утверждающий'),publisher:ggT('role.publisher','Публикатор'),creator:ggT('role.creator','Создатель')};
  var ROLE_CLS={owner:'rc-owner',approver:'rc-approver',publisher:'rc-publisher',creator:'rc-creator'};
  function fmtDate(iso){try{var d=new Date(iso);if(isNaN(d))return '';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}catch(e){return '';}}
  function fmtDT(iso){try{var d=new Date(iso);if(isNaN(d))return '';return d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
  function inf(n){return n>=9999?'∞':n;}
  function stat(el,t,ok){el.className='status '+(ok?'ok':'err');el.textContent=t;}

  fetch('/api/profile',{headers:{'Cache-Control':'no-cache'}}).then(function(r){if(r.status===401){location.href='/login?next='+encodeURIComponent('/profile');throw new Error('auth');}return r.json();}).then(function(P){
    var u=P.user,pl=P.plan,usage=P.usage;
    var letter=(u.name||u.email||'?').trim().charAt(0).toUpperCase();
    var root=$('root');
    var h='<div class="hero"><div class="avatar">'+esc(letter)+'</div><div><h1>'+esc(u.name||ggT('profile.anonName','Без имени'))+'</h1><div class="mail">'+esc(u.email)+'</div><div class="since">'+ggT('profile.since','В команде с ')+esc(fmtDate(u.created_at)||'—')+'</div></div></div>';

    h+='<h2>'+ggT('profile.personal','Личные данные')+'</h2><div class="card"><form id="nameForm" style="max-width:420px"><label for="nm">'+ggT('common.label.name','Имя')+'</label><input id="nm" maxlength="80" value="'+esc(u.name||'')+'"><button type="submit" id="nmBtn">'+ggT('profile.saveName','Сохранить имя')+'</button><div class="status" id="nmStat"></div></form></div>';

    var ub=P.usage_brands,uc=P.usage_channels,up=P.usage_posts;
    function bar(n,max){var pct=max>0&&max<9999?Math.min(100,Math.round(n*100/max)):0;return '<div class="bar"><i style="width:'+pct+'%"></i></div>';}
    h+='<h2>'+ggT('profile.planLimits','Тариф и лимиты')+'</h2><div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">'+ggT('profile.planLabel','Тариф: ')+'<span class="badge">'+esc(PLAN_NAMES[pl.code]||pl.code)+'</span></h3><a class="btn" href="/pricing">'+ggT('billing.swap','Сменить тариф')+'</a></div>'+
      '<div style="margin-top:14px"><div class="mut"><b>'+ub.used+ggT('profile.usage.of',' из ')+inf(ub.max)+'</b>'+ggT('profile.usage.brands',' брендов')+'</div>'+bar(ub.used,ub.max)+
      '<div class="mut"><b>'+uc.used+' из '+inf(uc.max)+'</b>'+ggT('profile.usage.channels',' каналов')+'</div>'+bar(uc.used,uc.max)+
      '<div class="mut"><b>'+up.used+' из '+inf(up.max)+'</b>'+ggT('profile.usage.posts',' постов сегодня')+'</div>'+bar(up.used,up.max)+
      '</div><div class="tiny">'+ggT('profile.limitsNote','Лимиты обновляются сразу после смены тарифа.')+'</div></div>';

    h+='<h2>'+ggT('profile.myBrands','Мои бренды')+'</h2><div class="card">';
    if(P.brands.length){h+='<div class="blist">'+P.brands.map(function(b){return '<a class="bitem" href="/app?brand='+encodeURIComponent(b.name)+'"><span><span class="dotc"></span>'+esc(b.name)+'</span><span class="tiny">'+b.posts_count+ggT('profile.postsCount',' пост(ов)')+'</span></a>';}).join('')+'</div>';}
    else{h+='<div class="empty">'+ggT('profile.noBrands','Брендов пока нет.')+'</div>';}
    h+='<div style="margin-top:12px"><a class="btn ghost" href="/partner" >'+ggT('profile.addBrand','+ Добавить бренд')+'</a></div></div>';

    h+='<h2>'+ggT('team.h1','Команда')+'</h2><div class="card">';
    if(P.user.role==='owner'){
      if(P.team.length){h+=P.team.map(function(m){var st=m.invite_status;var chip=st==='pending'?'<span class="rolechip rc-pending">'+ggT('profile.invPending','Приглашение не принято')+'</span>':(st==='accepted'?'<span class="rolechip rc-owner">'+ggT('profile.inTeam','В команде')+'</span>':'');return '<div class="trow"><b>'+esc(m.name)+'</b><span class="rolechip '+(ROLE_CLS[m.role]||'rc-creator')+'">'+esc(ROLE_NAMES[m.role]||m.role)+'</span>'+chip+'</div>';}).join('');}
      else{h+='<div class="empty">'+ggT('profile.teamEmpty','Ты пока один. Пригласи помощников.')+'</div>';}
      h+='<div style="margin-top:12px"><a class="btn ghost" href="/partner/team" >'+ggT('profile.manageTeam','Управлять командой')+'</a></div>';
    }else{
      h+='<div class="trow"><span class="rolechip '+(ROLE_CLS[P.role]||'rc-creator')+'">'+esc(ROLE_NAMES[P.role]||P.role)+'</span><span class="mut">'+ggT('profile.yourRole','— твоя роль в команде GOOD Growth')+'</span></div><div style="margin-top:10px"><a class="btn ghost" href="/partner/team" >'+ggT('profile.wholeTeam','Вся команда')+'</a></div>';
    }
    h+='</div>';

    var s=P.settings;
    h+='<h2>'+ggT('profile.settings','Настройки')+'</h2><div class="grid">';
    h+='<div class="card"><h3>'+ggT('profile.notifPrivacy','Уведомления и приватность')+'</h3>';
    if(s){
      h+='<label for="ntf">'+ggT('profile.notifications','Уведомления')+'</label><select id="ntf"><option value="email"'+(s.notifications==='email'?' selected':'')+'>'+ggT('profile.notif.email','На email')+'</option><option value="telegram"'+(s.notifications==='telegram'?' selected':'')+'>'+ggT('profile.notif.telegram','В Telegram')+'</option><option value="off"'+(s.notifications==='off'?' selected':'')+'>'+ggT('profile.notif.off','Выключено')+'</option></select>'+
      '<label for="prv">'+ggT('profile.privacy','Кто видит профиль')+'</label><select id="prv"><option value="all"'+(s.privacy==='all'?' selected':'')+'>'+ggT('profile.priv.all','Все')+'</option><option value="team"'+(s.privacy==='team'?' selected':'')+'>'+ggT('profile.priv.team','Только команда')+'</option><option value="nobody"'+(s.privacy==='nobody'?' selected':'')+'>'+ggT('profile.priv.nobody','Никто')+'</option></select>'+
      '<div style="margin-top:12px"><button id="setBtn" class="ghost">'+ggT('profile.saveSettings','Сохранить настройки')+'</button></div><div class="status" id="setStat"></div>';
    }else{
      h+='<div class="empty">'+ggT('profile.noSettings','Смены тарифов ещё не было — настройки появятся после первого изменения тарифа.')+'</div>';
    }
    h+='</div>';
    h+='<div class="card"><h3>'+ggT('profile.appearance','Оформление')+'</h3>'
      +'<p class="mut">'+ggT('profile.theme.hint','Тема применяется сразу и запоминается на этом устройстве.')+'</p>'
      +'<div class="gg-theme-pick" role="group" aria-label="'+ggT('profile.appearance','Оформление')+'">'
      +'<button type="button" data-theme-pick="dark">'+ggT('profile.theme.dark','Тёмная')+'</button>'
      +'<button type="button" data-theme-pick="light">'+ggT('profile.theme.light','Светлая')+'</button>'
      +'<button type="button" data-theme-pick="system">'+ggT('profile.theme.system','Системная')+'</button>'
      +'</div></div>';
    h+='<div class="card"><h3>'+ggT('profile.security','Безопасность')+'</h3><form id="passForm"><div class="frow"><div><label for="p0">'+ggT('profile.curPassword','Текущий пароль')+'</label><input id="p0" type="password" autocomplete="current-password"></div><div><label for="p1">'+ggT('profile.newPassword','Новый пароль')+'</label><input id="p1" type="password" autocomplete="new-password" placeholder="'+ggT('common.ph.password','Минимум 8 символов')+'"><div class="hint" id="pwHint" style="font-size:12.5px;color:#7a8775;margin-top:3px">'+ggT('common.hint.password','Только английские буквы, цифры и символы. Храним только хэш.')+'</div></div></div><div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap"><button type="submit" id="pBtn">'+ggT('profile.changePassword','Сменить пароль')+'</button><button type="button" id="outAll" class="ghost">'+ggT('profile.logoutAll','Выйти на других устройствах')+'</button></div><div class="status" id="pStat"></div></form></div>';
    h+='</div>';

    h+='<h2>'+ggT('profile.history','История')+'</h2><div class="grid"><div class="card"><h3>'+ggT('profile.myPosts','Мои посты')+'</h3>';
    if(P.posts.length){h+='<ul class="hist">'+P.posts.map(function(p){return '<li><span>'+((p.published_at)?'📣':'📝')+'</span><span>'+esc(p.title)+'</span><span class="d">'+esc(fmtDT(p.published_at||p.created_at))+'</span></li>';}).join('')+'</ul>';}
    else{h+='<div class="empty">'+ggT('profile.noPosts','Постов ещё нет.')+'</div>';}
    h+='</div><div class="card"><h3>'+ggT('profile.planChanges','Смены тарифов')+'</h3>';
    if(P.subs.length){h+='<ul class="hist">'+P.subs.map(function(x){return '<li><span class="rolechip rc-owner">'+esc(PLAN_NAMES[x.plan_code]||x.plan_code)+'</span><span class="d">'+esc(fmtDT(x.created_at))+'</span></li>';}).join('')+'</ul>';}
    else{h+='<div class="empty">'+ggT('profile.noChanges','Смен ещё не было.')+'</div>';}
    h+='</div></div>';
    root.innerHTML=h;

    /* тема оформления — приказ №74 */
    (function(){
      var picks=root.querySelectorAll('[data-theme-pick]');
      for(var i=0;i<picks.length;i++){
        picks[i].addEventListener('click',function(){
          if(window.ggTheme)window.ggTheme.set(this.getAttribute('data-theme-pick'));
        });
      }
      if(window.ggTheme)window.ggTheme.paint();
    })();

    /* name form */
    $('nameForm').addEventListener('submit',function(e){
      e.preventDefault();var b=$('nmBtn');b.disabled=true;
      fetch('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('nm').value})})
        .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
        .then(function(res){b.disabled=false;if(res.status===200){stat($('nmStat'),ggT('profile.msg.nameSaved','Имя сохранено.'),true);try{var c=JSON.parse(sessionStorage.getItem('gg_user')||'{}');c.name=res.d.user.name;sessionStorage.setItem('gg_user',JSON.stringify(c));}catch(e){}}else{stat($('nmStat'),res.d.error||ggT('profile.msg.err','Ошибка'),false);}})
        .catch(function(){b.disabled=false;stat($('nmStat'),ggT('profile.msg.nonet','Сервер не отвечает.'),false);});
    });

    /* password form */
    $('passForm').addEventListener('submit',function(e){
      e.preventDefault();var b=$('pBtn');
      try{$('p1').addEventListener('input',function(){var h=document.getElementById('pwHint');if(h)h.classList.toggle('bad',this.value.length>0&&this.value.length<8);});}catch(err){} /* O37 */
      var p0=$('p0').value,p1=$('p1').value;
      if(p1.length<8){stat($('pStat'),ggT('profile.msg.shortPass','Новый пароль — минимум 8 символов.'),false);return;}
      if(!/^[A-Za-z0-9!@#$%^&*_+\-=.,?;:'"\(\)\[\]{}<>\\|\/~`\s]+$/.test(p1)){stat($('pStat'),ggT('common.msg.charset','Пароль может содержать только английские буквы, цифры и символы'),false);return;} /* O37 */
      b.disabled=true;
      fetch('/api/profile/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:p0,next:p1})})
        .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
        .then(function(res){b.disabled=false;if(res.status===200){stat($('pStat'),ggT('profile.msg.passChanged','Пароль изменён. Другие сессии завершены.'),true);$('p0').value='';$('p1').value='';}else{stat($('pStat'),res.d.error||ggT('profile.msg.err','Ошибка'),false);}})
        .catch(function(){b.disabled=false;stat($('pStat'),ggT('profile.msg.nonet','Сервер не отвечает.'),false);});
    });

    /* logout all */
    $('outAll').addEventListener('click',function(){
      if(!confirm(ggT('profile.msg.logoutConfirm','Завершить все сессии на других устройствах? Текущая останется активной.')))return;
      fetch('/api/profile/sessions',{method:'DELETE'}).then(function(){try{sessionStorage.removeItem('gg_user');}catch(e){}location.href='/';});
    });

    /* settings */
    var sb=$('setBtn');
    if(sb)sb.addEventListener('click',function(){
      sb.disabled=true;
      fetch('/api/profile/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notifications:$('ntf').value,privacy:$('prv').value})})
        .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
        .then(function(res){sb.disabled=false;if(res.status===200){stat($('setStat'),ggT('profile.msg.settingsSaved','Настройки сохранены.'),true);}else{stat($('setStat'),res.d.error||ggT('profile.msg.err','Ошибка'),false);}})
        .catch(function(){sb.disabled=false;stat($('setStat'),ggT('profile.msg.nonet','Сервер не отвечает.'),false);});
    });
  }).catch(function(e){if(e.message!=='auth')$('root').innerHTML='<p class="mut">'+ggT('profile.msg.loadFail','Профиль не загрузился. Обнови страницу.')+'</p>';});
})();
</script>
<script src="/theme.js" defer></script>
<script src="/rail.js" defer></script>
</body>
</html>

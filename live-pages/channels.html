<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem("gg_theme")||"dark";var d=document.documentElement;if(t==="system"){d.setAttribute("data-theme-src","system");}else{d.setAttribute("data-theme",t==="light"?"light":"dark");}}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="channels.meta.title">Каналы бренда — GOOD Growth</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">

<style>
:root{--bg:#f6f8f4;--surface:#fff;--ink:#1c2419;--muted:#5c6b57;--hair:#e3e9de;--green:#3f9d63;--deep:#2f7a4c;--danger:#dc6b5f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:34px 20px 60px}
h1{font-size:26px;letter-spacing:-.01em;margin-bottom:6px}
.sub{color:var(--muted);font-size:14.5px;margin-bottom:24px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:20px 22px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--hair);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.row b{font-size:14.5px}
.row .cid{color:var(--muted);font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
button{cursor:pointer;font:inherit}
.del{background:none;border:1px solid var(--hair);color:var(--danger);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.del:hover{border-color:var(--danger)}
.add{display:flex;gap:10px;margin-top:6px}
input{flex:1;font:inherit;font-size:14.5px;padding:10px 14px;border:1px solid var(--hair);border-radius:11px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid #cfe3d3;border-color:var(--green)}
.go{background:var(--green);color:#fff;border:0;border-radius:11px;padding:10px 18px;font-weight:700;font-size:14px}
.go:hover{background:var(--deep)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.net{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);border-radius:12px;padding:10px 12px;background:var(--surface)}
.net.ok{border-color:#bcd9c4}
.net .ic{width:28px;height:28px;border-radius:9px;background:var(--bg);border:1px solid var(--hair);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.net span.n{flex:1;font-size:13.5px;font-weight:600}
.ok .st{color:var(--deep);font-size:11.5px;font-weight:800}
.soon{opacity:.55}
.soon .st{color:var(--muted);font-size:11.5px;font-weight:600}
.mut{color:var(--muted);font-size:13px}
</style>
<link rel="stylesheet" href="/style-c.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/rail.css"><link rel="stylesheet" href="/blocks.css">
</head>
<body class="gg-with-rail">

a-i18n="rail.channels">Каналы</span></a><a href="/app/analytics" data-k="analytics"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5h11"/><path d="M4.5 12.5V8M8 12.5V4.2M11.5 12.5V9.6"/></svg><span data-i18n="rail.analytics">Аналитика</span></a><a href="/partner/team" data-k="team"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.8" cy="6.2" r="2"/><circle cx="11.2" cy="7" r="1.5"/><path d="M2.6 13.2c0-2 1.5-3.1 3.2-3.1s3.2 1.1 3.2 3.1"/><path d="M10.1 13.2c0-1.5.9-2.4 2.1-2.4s2.1.9 2.1 2.4"/></svg><span data-i18n="rail.team">Команда</span></a><a href="/partner/info" data-k="partners"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="8" r="1.7"/><circle cx="12" cy="4.6" r="1.7"/><circle cx="12" cy="11.4" r="1.7"/><path d="M5.5 7.3l4.9-2M5.5 8.7l4.9 2"/></svg><span data-i18n="rail.partners">Партнёрам</span></a><a href="/app/billing" data-k="billing"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="3.8" width="12.4" height="8.4" rx="1.6"/><path d="M1.8 6.8h12.4"/><path d="M4.5 9.8h3"/></svg><span data-i18n="rail.billing">Оплата</span></a></nav><div class="gg-rail-foot"><a href="/profile" data-k="profile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg><span data-i18n="rail.settings">Настройки</span></a><button type="button" class="gg-rail-theme" id="ggRailTheme"><span class="gg-ico">☾</span><span class="gg-tx" data-i18n="rail.theme.dark">Тёмная</span></button><button type="button" class="gg-rail-out" id="ggRailOut" data-i18n="rail.logout">Выйти</button></div></aside>
<script src="/i18n/i18n.js"></script>
<div class="wrap">
  <h1 data-i18n="channels.h1">Каналы бренда</h1>
  <p class="sub" id="sub">Загрузка…</p>
  <div class="panel">
    <div id="list"><span class="mut">Загружаю…</span></div>
    <div class="add">
      <input id="chat" placeholder="@имя_канала или -100..." data-i18n-attr="placeholder:channels.ph">
      <button class="go" id="go" data-i18n="channels.connect">+ Подключить</button>
    </div>
  </div>
  <div class="panel">
    <div class="grid" id="nets"></div>
    <p class="mut" style="margin-top:12px" data-i18n="channels.note">Серые — в разработке: OAuth-подключение откроем в ближайших спринтах.</p>
  </div>
</div>
<script src="/gg-header.js" defer></script>
<script>
(function(){
  var brand = new URLSearchParams(location.search).get('brand') || sessionStorage.getItem('gg_brand') || '';
  if (!brand) { document.getElementById('sub').textContent = ggT('channels.noBrand','Бренд не выбран — открой список брендов.'); document.getElementById('list').innerHTML=''; }
  else document.getElementById('sub').textContent = ggT('channels.sub','Бренд #{id} — подключённые каналы и соцсети.').replace('{id}', brand);
  function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var NETS = [['Telegram','ok','✈'],['VK','soon','V'],['Pinterest','soon','P'],['Facebook','soon','f'],['Instagram','soon','IG'],['X (Twitter)','soon','X'],['LinkedIn','soon','in'],['YouTube','soon','▶'],['TikTok','soon','♪'],['Одноклассники','soon','ок']];
  document.getElementById('nets').innerHTML = NETS.map(function(n){
    return '<div class="net ' + n[1] + '"><span class="ic">' + n[2] + '</span><span class="n">' + n[0] + '</span>' +
      (n[1]==='ok' ? '<span class="st">' + ggT('channels.st.ok','Подключён') + '</span>' : '<span class="st">' + ggT('channels.st.soon','Скоро') + '</span>') + '</div>';
  }).join('');
  async function load(){
    if (!brand) return;
    try {
      var r = await fetch('/api/brands/' + brand + '/channels');
      var arr = await r.json();
      if (!Array.isArray(arr)) arr = arr.channels || [];
      document.getElementById('list').innerHTML = arr.length
        ? arr.map(function(c){ return '<div class="row"><span><b>' + esc(c.title || '') + '</b> <span class="cid">' + esc(c.chat_id) + '</span></span><button class="del" data-id="' + c.id + '">' + ggT('channels.disconnect','Отключить') + '</button></div>'; }).join('')
        : '<span class="mut">' + ggT('channels.empty','Пока пусто — подключи первый Telegram-канал ниже.') + '</span>';
    } catch(e){ document.getElementById('list').innerHTML = '<span class="mut">' + ggT('channels.err','Ошибка загрузки') + '</span>'; }
  }
  load();
  document.getElementById('go').addEventListener('click', async function(){
    var v = document.getElementById('chat').value.trim();
    if (!v || !brand) return;
    await fetch('/api/brands/' + brand + '/channels', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: v }) });
    document.getElementById('chat').value = '';
    load();
  });
  document.getElementById('list').addEventListener('click', async function(e){
    var d = e.target.closest('[data-id]');
    if (!d) return;
    if (!confirm(ggT('channels.confirm','Отключить канал?'))) return;
    await fetch('/api/channels/' + d.getAttribute('data-id'), { method: 'DELETE' });
    load();
  });
})();
</script>
<script src="/theme.js" defer></script>
<script src="/rail.js" defer></script>

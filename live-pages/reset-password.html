<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <title>Новый пароль — GOOD Growth</title>
  <link rel="stylesheet" href="/style-c.css">
  <style>
  *{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#08090A;color:#F4F4F5}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 40px;background:linear-gradient(180deg,#0B0C0E,#08090A)}
.box{width:100%;max-width:430px;text-align:left}
.mhead{text-align:center;margin-bottom:6px}
.mhead h1{font-size:27px;margin-bottom:10px;letter-spacing:-.01em;color:#F4F4F5}
.mhead .sub{text-align:center;color:#A1A1AA;font-size:15.5px;margin:0}
form{margin-top:24px;display:flex;flex-direction:column;gap:12px;text-align:left}
label{font-size:13.5px;font-weight:700;color:#C9C9D1}
input{width:100%;padding:12px 14px;border:1px solid rgba(232,165,79,.28);border-radius:10px;font:inherit;font-size:15px;background:#111216;color:#F4F4F5}
input::placeholder{color:#5F626B}
.pw-wrap{display:block;position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;color:#E8A54F;padding:4px;line-height:0;border-radius:8px;transition:color 150ms linear}
.pw-eye:hover,.pw-eye:focus-visible{color:#F3C583}
.pw-eye svg{width:20px;height:20px}
.pw-eye .off-i{display:none}
.pw-eye.on .on-i{display:none}
.pw-eye.on .off-i{display:block}
button.pw-eye,button.pw-eye:hover,button.pw-eye:active,button.pw-eye:focus{transform:translateY(-50%) !important}
input[type="password"]::-ms-reveal,input[type="password"]::-ms-clear{display:none !important;height:0;width:0}
input:focus{outline:none;border-color:rgba(232,165,79,.65);background:#0E0F12;box-shadow:0 0 0 3px rgba(232,165,79,.15)}
button.btn{margin-top:6px;background:linear-gradient(180deg,#F0BC72,#E8A54F 55%,#DF9A48);color:#1B1206;font-weight:700;font-size:15px;padding:12px 22px;border:1px solid rgba(255,255,255,.16);border-radius:10px;cursor:pointer;font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 10px 26px -10px rgba(232,165,79,.55);transition:transform 150ms cubic-bezier(.22,1,.36,1)}
button.btn:hover{background:linear-gradient(180deg,#F7C987,#EDAB5D 55%,#E8A54F);transform:translateY(-1px)}
button.btn:disabled{opacity:.6;cursor:wait;transform:none}
.msg{margin-top:14px;font-size:14.5px;border-radius:10px;padding:10px 14px;display:none;text-align:left}
.msg.err{display:block;background:rgba(232,105,79,.10);color:#E88A6F;border:1px solid rgba(232,105,79,.30)}
.msg.ok{display:block;background:rgba(232,165,79,.08);color:#F3C583;border:1px solid rgba(232,165,79,.25)}
.alt{margin-top:18px;font-size:14px;color:#A1A1AA;text-align:center}
.alt a{color:#E8A54F;font-weight:600;text-decoration:none}
.alt a:hover{text-decoration:underline}
.hint{font-size:12.5px;color:#8B8B95;margin-top:3px}
.hint.bad{color:#E88A6F;font-weight:700}
@media (max-width:480px){.wrap{padding:28px 18px}.mhead h1{font-size:23px}}
  </style>
</head>
<body>
<div class="wrap"><div class="box">
  <div class="mhead">
    <h1>Новый пароль</h1>
    <p class="sub">Придумай новый пароль — минимум 8 символов.</p>
  </div>
  <form id="rpForm" novalidate>
    <div><label for="p1">Новый пароль</label><span class="pw-wrap"><input id="p1" type="password" autocomplete="new-password" required placeholder="••••••••"><button type="button" class="pw-eye" id="pwEye" aria-label="Показать пароль"><svg class="on-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></span><div class="hint" id="pwHint">Только английские буквы, цифры и символы. Храним только хэш.</div></div>
    <div><label for="p2">Повтори пароль</label><input id="p2" type="password" autocomplete="new-password" required placeholder="••••••••"></div>
    <button class="btn" type="submit" id="rpBtn">Сменить пароль</button>
  </form>
  <div class="msg" id="msg"></div>
</div></div>
<script>
(function(){
  var f=document.getElementById('rpForm'),m=document.getElementById('msg'),b=document.getElementById('rpBtn');
  var p1=document.getElementById('p1'),p2=document.getElementById('p2'),h=document.getElementById('pwHint');
  var token=new URLSearchParams(location.search).get('token')||'';
  function show(t,ok){m.className='msg '+(ok?'ok':'err');m.textContent=t;}
  if(!token){show('Ссылка неполная: нет токена. Запроси сброс заново на /forgot-password.',false);f.style.display='none';return;}
  fetch('/api/reset-password/verify?token='+encodeURIComponent(token)).then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});}).then(function(res){
    if(res.status!==200){show(res.d.error||'Ссылка устарела. Запроси новую на /forgot-password.',false);f.style.display='none';}
  }).catch(function(){});
  p1.addEventListener('input',function(){h.classList.toggle('bad',this.value.length>0&&this.value.length<8);});
  f.addEventListener('submit',function(e){
    e.preventDefault();
    m.className='msg';m.textContent='';
    var v1=p1.value,v2=p2.value;
    if(v1.length<8){show('Пароль — минимум 8 символов.',false);return;}
    if(v1!==v2){show('Пароли не совпадают.',false);return;}
    if(!/^[A-Za-z0-9!@#$%^&*_+\-=.,?;:'"\(\)\[\]{}<>\\|\/~\x60\s]+$/.test(v1)){show('Пароль может содержать только английские буквы, цифры и символы',false);return;}
    b.disabled=true;
    fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:v1})})
      .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
      .then(function(res){
        if(res.status===200){
          show('Пароль изменён. Сейчас перебросим на вход…',true);
          setTimeout(function(){location.href='/login?reset=1';},1200);
        } else {
          b.disabled=false;
          show((res.d&&res.d.error)||'Не получилось. Попробуй ещё раз.',false);
        }
      })
      .catch(function(){b.disabled=false;show('Сервер не отвечает. Попробуй ещё раз.',false);});
  });
  var e=document.getElementById('pwEye');
  if(e){[p1,p2].forEach(function(inp){e.addEventListener('click',function(){var s=inp.type==='password';inp.type=s?'text':'password';e.classList.toggle('on',s);});});}
})();
</script>
<script src="/gg-header.js" defer></script>
</body>
</html>

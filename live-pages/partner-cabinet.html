<div class="wrap">
<h1 data-i18n="rail.menu.cabinet">Партнёрский кабинет</h1>
<p class="sub">твоя ссылка, переходы и начисления — без звёздочек</p>

<div id="pcRoot"><p class="pc-load" data-i18n="channels.loading2">Загружаю…</p></div>

<script>
(function () {
  var root = document.getElementById('pcRoot');
  function money(n) {
    var v = Number(n || 0);
    var s2 = (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, '');
    var parts = s2.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
  }

  var PLAN_NAMES = { 490: 'Рост', 990: 'Профи', 2990: 'Агентство', 5990: 'Безлимит' };
  function matrixHtml(rows) {
    if (!rows || !rows.length) return '';
    var head = '<tr><th>Тариф</th><th>Цена</th><th>Друг 25%</th><th>Проводник 35%</th><th>Посол 45%</th></tr>';
    var body = rows.map(function (r) {
      var name = PLAN_NAMES[r.price] || '';
      return '<tr><td>' + name + '</td><td>' + r.price + ' ₽</td>' +
        '<td>' + money(r.friend) + ' ₽</td><td>' + money(r.guide) + ' ₽</td><td>' + money(r.ambassador) + ' ₽</td></tr>';
    }).join('');
    return '<section class="pc-link" style="margin-top:18px">' +
      '<p class="pr-lbl">что платим</p>' +
      '<table class="compare" style="width:100%">' + head + body + '</table>' +
      '<p class="pc-hint" style="margin-top:10px">Ставка 25–45%, но не выше 900 ₽ за одного клиента в месяц. ' +
      'На дорогих тарифах потолок срабатывает — пишем это крупно, а не в сноске.</p>' +
    '</section>';
  }

  function levelHtml(p) {
    var done = Math.max(0, Math.min(100, Math.round((p.paid_clients / Math.max(1, p.paid_clients + p.to_next)) * 100)));
    return '<section class="pc-link" style="margin-top:18px">' +
      '<p class="pr-lbl">твой уровень</p>' +
      '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">' +
        '<b style="font:400 26px/1.2 Georgia,serif">' + p.title + '</b>' +
        '<span style="color:#F3C583;font:600 15px/1 Consolas,monospace">' + p.rate + '% · до ' + p.cap + ' ₽ за клиента</span>' +
      '</div>' +
      '<div style="height:8px;border-radius:99px;background:#15171c;overflow:hidden;margin:12px 0 8px">' +
        '<i style="display:block;height:100%;width:' + done + '%;background:linear-gradient(90deg,#E8A54F,#F3C583)"></i>' +
      '</div>' +
      '<p class="pc-hint">Привёл оплативших: ' + p.paid_clients +
        (p.next_title ? ' · до «' + p.next_title + '» осталось ' + p.to_next : ' · выше некуда, ты Посол') +
      '</p>' +
    '</section>';
  }

  function moneyHtml(p) {
    var left = Math.max(0, 1000 - Number(p.pending_rub || 0));
    return '<div class="pc-stats" style="margin-top:16px">' +
      '<div class="pc-stat"><b>' + p.clicks + '</b><span>переходов</span></div>' +
      '<div class="pc-stat"><b>' + p.signups + '</b><span>регистраций</span></div>' +
      '<div class="pc-stat"><b>' + p.paid_clients + '</b><span>оплатили</span></div>' +
      '<div class="pc-stat"><b>' + money(p.pending_rub) + ' ₽</b><span>копится</span></div>' +
    '</div>' +
    '<p class="pc-hint" style="margin-top:10px">' +
      (left > 0
        ? 'Копится ' + money(p.pending_rub) + ' ₽ из 1 000 ₽. Наберётся тысяча — выплата до 5 числа следующего месяца.'
        : 'Порог собран: ' + money(p.pending_rub) + ' ₽ · выплата до 5 числа следующего месяца.') +
    '</p>' +
    (Number(p.paid_rub || 0) > 0 ? '<p class="pc-hint">Уже выплачено: ' + money(p.paid_rub) + ' ₽</p>' : '');
  }

  function linkHtml(p) {
    return '<section class="pc-link">' +
      '<p class="pr-lbl">твоя ссылка · код ' + p.code + '</p>' +
      '<div class="pc-link-row">' +
        '<input id="pcLink" readonly value="' + p.link + '">' +
        '<button type="button" class="pr-go" id="pcCopy">Скопировать</button>' +
      '</div>' +
      '<p class="pc-hint">Ссылка живёт 60 дней после перехода. Клиент вернётся — останется твоим.</p>' +
    '</section>';
  }

  function wireCopy() {
    var btn = document.getElementById('pcCopy');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var inp = document.getElementById('pcLink');
      inp.select();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(inp.value).catch(function () { try { document.execCommand('copy'); } catch (e) {} });
        } else { try { document.execCommand('copy'); } catch (e) {} }
        btn.textContent = 'Скопировано';
        setTimeout(function () { btn.textContent = 'Скопировать'; }, 1600);
      } catch (e) {}
    });
  }

  function paint(p) {
    root.innerHTML = linkHtml(p) + levelHtml(p) + moneyHtml(p) + matrixHtml(p.matrix) +
      '<p class="pc-hint" style="margin-top:16px"><a href="/partner/program" style="color:#F3C583">Как это работает →</a></p>' +
      '<div class="pr-honest" style="margin-top:18px"><b>Честно:</b> оплаты пока не подключены — ' +
      'начисления начнутся вместе с ними. Правила и проценты уже те, что в таблице. ' +
      'Порог выплаты 1 000 ₽, холд 30 дней, выплата до 5 числа.</div>';
    wireCopy();
  }

  function joinState(note) {
    root.innerHTML =
      '<div class="pc-empty">' +
        '<h2>Стать партнёром</h2>' +
        '<p>' + (note || 'Включи участие — получишь код и ссылку сразу. Ставка 25%, до 500 ₽ за клиента.') + '</p>' +
        '<div class="pc-acts">' +
          '<button type="button" class="pr-go" id="pcJoin">Включить участие</button>' +
          '<a class="step-go ghost" href="/partner/program">Как это работает</a>' +
        '</div>' +
        '<p class="pc-hint" id="pcJoinSay"></p>' +
      '</div>';
    var b = document.getElementById('pcJoin');
    b.addEventListener('click', function () {
      b.disabled = true;
      fetch('/api/partner/join', { method: 'POST', credentials: 'same-origin' })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) {
            if (res.j && res.j.needAuth) { location.href = '/login?next=/partner/cabinet'; return; }
            document.getElementById('pcJoinSay').textContent = (res.j && res.j.error) || 'Не получилось.';
            b.disabled = false;
            return;
          }
          load();
        })
        .catch(function () { b.disabled = false; document.getElementById('pcJoinSay').textContent = 'Сервер не отвечает.'; });
    });
  }

  function load() {
    fetch('/api/partner/me', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : { ready: false }; })
      .then(function (d) {
        if (!d || !d.ready || !d.partner) { joinState(d && d.note); return; }
        paint(d.partner);
      })
      .catch(function () { root.innerHTML = '<p class="pc-load">Не удалось загрузить кабинет. Обнови страницу.</p>'; });
  }

  load();
})();
</script>
</div>

<title>Аналитика — GOOD Growth</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>
  :root{--an-bg:#0A0B0D;--an-panel:#101114;--an-panel2:#14161A;--an-line:rgba(236,226,206,.10);
        --an-ink:#F4F1EA;--an-mut:#8A857C;--an-copper:#E8A54F;--an-copper-lt:#F3C583;
        --an-ok:#8ED08A;--an-warn:#E0A46A;--an-bad:#E07A6A}
  .an-wrap{max-width:1220px;margin:0 auto;padding:30px 26px 90px}
  .an-kick{font:500 10.5px/1 'JetBrains Mono',Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--an-copper);margin:0 0 10px}
  h1.an-h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:32px;margin:0 0 6px}
  .an-sub{margin:0 0 24px;color:var(--an-mut);font-size:13.5px}

  /* плитки */
  .an-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .an-tile{border:1px solid var(--an-line);border-radius:14px;background:linear-gradient(180deg,#111216,#0D0E11);padding:14px 16px 10px;position:relative;overflow:hidden}
  .an-tile .l{font:500 9px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6F6A61;margin:0 0 8px}
  .an-tile .n{font-size:26px;line-height:1;color:var(--an-ink);font-family:'Playfair Display',Georgia,serif}
  .an-tile .n small{font-size:11px;color:var(--an-mut);font-family:'Golos Text',sans-serif;margin-left:6px}
  .an-tile svg{display:block;width:100%;height:34px;margin-top:8px;opacity:.9}

  /* сетка */
  .an-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  .an-card{border:1px solid var(--an-line);border-radius:16px;background:var(--an-panel);padding:18px 20px}
  .an-card h2{margin:0 0 4px;font:500 14px/1.2 'Golos Text',sans-serif;color:var(--an-ink)}
  .an-card .cap{margin:0 0 14px;font:500 9px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6F6A61}
  .an-chart{width:100%;height:220px;display:block}
  .an-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--an-mut)}
  .an-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

  /* пончик */
  .an-donut{display:flex;gap:16px;align-items:center}
  .an-donut svg{flex:none}
  .an-donut .rows{flex:1;min-width:0}
  .an-donut .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#CFC9BD;margin:0 0 6px}
  .an-donut .row b{margin-left:auto;color:var(--an-ink);font-weight:600}
  .an-donut .dot{width:8px;height:8px;border-radius:2px;flex:none}

  /* подсказки */
  .an-ins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  .an-ins .col{border:1px solid var(--an-line);border-radius:14px;background:var(--an-panel);padding:14px 16px}
  .an-ins .col h3{margin:0 0 10px;font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
  .an-ins .col.good h3{color:var(--an-ok)}
  .an-ins .col.warn h3{color:var(--an-warn)}
  .an-ins .col.miss h3{color:#9C968B}
  .an-ins p{margin:0 0 8px;font-size:12.5px;line-height:1.5;color:#CFC9BD;display:flex;gap:8px}
  .an-ins p:last-child{margin-bottom:0}
  .an-ins p .b{flex:none;color:inherit;opacity:.85}

  /* активность */
  .an-act{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(236,226,206,.06);font-size:13px;color:#CFC9BD}
  .an-act:last-child{border-bottom:0}
  .an-act .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-act .d{color:var(--an-mut);font-size:11.5px;flex:none}
  .an-act .bd{font-size:11px;color:var(--an-copper);border:1px solid rgba(232,165,79,.3);border-radius:999px;padding:2px 8px;flex:none}

  /* партнёр */
  .an-partner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid rgba(232,165,79,.28);
    border-radius:16px;background:linear-gradient(180deg,rgba(232,165,79,.08),rgba(232,165,79,.02));padding:16px 20px;margin-bottom:16px}
  .an-partner .k{font:500 9px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--an-copper);margin:0 0 6px}
  .an-partner .v{font-size:15px;color:var(--an-ink)}
  .an-partner .v small{color:var(--an-mut);font-size:12px}
  .an-partner a{margin-left:auto;color:var(--an-copper-lt);text-decoration:none;font-size:13px;border-bottom:1px solid rgba(232,169,79,.4)}

  .an-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
  .an-gauge, .an-ring{display:flex;flex-direction:column;align-items:center;gap:6px}
  .an-cap{margin:4px 0 0;font-size:11.5px;color:var(--an-mut);text-align:center}
  .an-cols-right{display:flex;flex-direction:column;gap:16px}
  .an-donut .rows small{font-size:10px}
  .an-empty{padding:26px;text-align:center;color:var(--an-mut);font-size:13px}
  @media (max-width:1080px){ .an-tiles{grid-template-columns:repeat(3,1fr)} .an-grid{grid-template-columns:1fr} .an-ins{grid-template-columns:1fr} }
  @media (max-width:640px){ .an-tiles{grid-template-columns:repeat(2,1fr)} }
</style>
</head>

<div class="an-wrap">
  <p class="an-kick">GOOD Growth · аналитика</p>
  <h1 class="an-h1">Аналитика</h1>
  <p class="an-sub">где всё хорошо, где споткнулись и чего не хватает — по твоим цифрам</p>
  <div id="anRoot"><p class="an-empty">Собираю цифры…</p></div>

<script>
(function () {
  var root = document.getElementById('anRoot');
  var COLORS = ['#E8A54F', '#8ED08A', '#6FA8F5', '#C58AF0', '#E07A6A', '#35D6C0'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function plural(n, hint) { return hint; }
  function mon(n) { return Number(n || 0).toLocaleString('ru-RU'); }
  function dateRu(iso) {
    if (!iso) return '';
    var d = new Date(String(iso).replace(' ', 'T'));
    if (isNaN(d.getTime())) return String(iso).slice(0, 10);
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  }

  /* мини-график для плитки */
  function spark(values, color) {
    var w = 120, h = 34, max = Math.max.apply(null, values.concat([1]));
    var step = values.length > 1 ? w / (values.length - 1) : w;
    var pts = values.map(function (v, i) {
      var x = i * step;
      var y = h - (v / max) * (h - 4) - 2;
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var area = '0,' + h + ' ' + pts.join(' ') + ' ' + w + ',' + h;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polygon points="' + area + '" fill="' + color + '" opacity=".10"></polygon>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    '</svg>';
  }

  /* большой график публикаций */
  function bigChart(daily) {
    var w = 720, h = 220, pad = { l: 34, r: 12, t: 12, b: 24 };
    var max = Math.max.apply(null, daily.map(function (x) { return x.n; }).concat([1]));
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    var step = daily.length > 1 ? iw / (daily.length - 1) : iw;
    var pts = daily.map(function (x, i) {
      var px = pad.l + i * step;
      var py = pad.t + ih - (x.n / max) * ih;
      return { x: px, y: py, v: x.n, d: x.d };
    });
    var line = pts.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var area = pad.l + ',' + (pad.t + ih) + ' ' + line + ' ' + (pad.l + iw) + ',' + (pad.t + ih);
    var grid = '';
    for (var g = 0; g <= 3; g++) {
      var gy = pad.t + (ih / 3) * g;
      grid += '<line x1="' + pad.l + '" y1="' + gy + '" x2="' + (w - pad.r) + '" y2="' + gy + '" stroke="rgba(236,226,206,.08)" stroke-width="1"/>';
      grid += '<text x="' + (pad.l - 8) + '" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="#6F6A61" font-family="monospace">' + Math.round(max - (max / 3) * g) + '</text>';
    }
    var labels = '';
    [0, 7, 14, 21, 29].forEach(function (i) {
      if (!daily[i]) return;
      var p = pts[i];
      labels += '<text x="' + p.x + '" y="' + (h - 6) + '" text-anchor="middle" font-size="9" fill="#6F6A61" font-family="monospace">' + daily[i].d.slice(5).replace('-', '.') + '</text>';
    });
    return '<svg class="an-chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      grid +
      '<polygon points="' + area + '" fill="url(#anGrad)" opacity=".28"/>' +
      '<defs><linearGradient id="anGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#E8A54F" stop-opacity=".55"/><stop offset="100%" stop-color="#E8A54F" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<polyline points="' + line + '" fill="none" stroke="#E8A54F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      labels +
    '</svg>';
  }

  /* пончик публикаций по брендам + «без бренда» */
  function donut(brands, totalAll) {
    var rows = brands.filter(function (b) { return b.published > 0; })
      .map(function (b) { return { name: b.name, n: b.published }; });
    var counted = rows.reduce(function (a, b) { return a + b.n; }, 0);
    var rest = Math.max(0, Number(totalAll || 0) - counted);
    if (rest > 0) rows.push({ name: 'без бренда', n: rest, muted: true });

    if (!rows.length) return '<p class="an-empty">Пока нет публикаций — нечего показывать в разрезе брендов.</p>';

    var total = rows.reduce(function (a, b) { return a + b.n; }, 0);
    var R = 62, r = 40, cx = 74, cy = 74, ang = -Math.PI / 2;
    var parts = '';
    rows.forEach(function (b, i) {
      var frac = total ? b.n / total : 0;
      var a2 = ang + frac * Math.PI * 2;
      var large = frac > 0.5 ? 1 : 0;
      var x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
      var x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      var xi2 = cx + r * Math.cos(a2), yi2 = cy + r * Math.sin(a2);
      var xi1 = cx + r * Math.cos(ang), yi1 = cy + r * Math.sin(ang);
      var col = b.muted ? '#3A3730' : COLORS[i % COLORS.length];
      parts += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
        ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
        ' L' + xi2.toFixed(1) + ' ' + yi2.toFixed(1) +
        ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + xi1.toFixed(1) + ' ' + yi1.toFixed(1) + ' Z" fill="' + col + '" opacity=".92"></path>';
      ang = a2;
    });
    var legend = rows.map(function (b, i) {
      var col = b.muted ? '#3A3730' : COLORS[i % COLORS.length];
      var pct = total ? Math.round((b.n / total) * 100) : 0;
      return '<div class="row"><span class="dot" style="background:' + col + '"></span>' +
        esc(b.name) + '<b>' + b.n + ' <small style="color:#6F6A61">' + pct + '%</small></b></div>';
    }).join('');
    return '<div class="an-donut"><svg width="148" height="148" viewBox="0 0 148 148">' +
      '<circle cx="74" cy="74" r="51" fill="none" stroke="rgba(236,226,206,.05)" stroke-width="22"></circle>' +
      parts +
      '<text x="74" y="68" text-anchor="middle" font-size="9" fill="#6F6A61" font-family="monospace" letter-spacing="1.4">ВСЕГО</text>' +
      '<text x="74" y="90" text-anchor="middle" font-size="23" fill="#F4F1EA" font-family="Georgia,serif">' + total + '</text></svg>' +
      '<div class="rows">' + legend + '</div></div>';
  }

/* универсальный круг: секторы с подсказками при наведении */
  function donutRows(rows, centerLabel) {
    var total = rows.reduce(function (a, b) { return a + b.n; }, 0);
    if (!total) return '<p class="an-empty">Пока пусто — нечего показывать.</p>';
    var R = 58, r = 38, cx = 72, cy = 72, ang = -Math.PI / 2;
    var parts = '';
    rows.forEach(function (b) {
      var frac = b.n / total;
      var a2 = ang + frac * Math.PI * 2;
      var large = frac > 0.5 ? 1 : 0;
      var x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
      var x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      var xi2 = cx + r * Math.cos(a2), yi2 = cy + r * Math.sin(a2);
      var xi1 = cx + r * Math.cos(ang), yi1 = cy + r * Math.sin(ang);
      var pct = Math.round(frac * 100);
      parts += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
        ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
        ' L' + xi2.toFixed(1) + ' ' + yi2.toFixed(1) +
        ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + xi1.toFixed(1) + ' ' + yi1.toFixed(1) + ' Z" fill="' + b.color + '" opacity=".92">' +
        '<title>' + esc(b.name) + ' · ' + b.n + ' · ' + pct + '%</title></path>';
      ang = a2;
    });
    var legend = rows.map(function (b) {
      var pct = Math.round((b.n / total) * 100);
      return '<div class="row"><span class="dot" style="background:' + b.color + '"></span>' +
        esc(b.name) + '<b>' + b.n + ' <small style="color:#6F6A61">' + pct + '%</small></b></div>';
    }).join('');
    return '<div class="an-donut"><svg width="144" height="144" viewBox="0 0 144 144">' +
      '<circle cx="72" cy="72" r="48" fill="none" stroke="rgba(236,226,206,.05)" stroke-width="20"></circle>' +
      parts +
      '<text x="72" y="66" text-anchor="middle" font-size="9" fill="#6F6A61" font-family="monospace" letter-spacing="1.2">' + esc(centerLabel) + '</text>' +
      '<text x="72" y="88" text-anchor="middle" font-size="22" fill="#F4F1EA" font-family="Georgia,serif">' + total + '</text></svg>' +
      '<div class="rows">' + legend + '</div></div>';
  }

  /* «стол и улица»: что вышло, что ещё в столе */
  function deskStreet(t) {
    var published = Number(t.published || 0);
    var drafts = Math.max(0, Number(t.posts || 0) - published);
    return donutRows([
      { name: 'вышло в люди', n: published, color: '#8ED08A' },
      { name: 'осталось в столе', n: drafts, color: '#E8A54F' }
    ], 'ПОСТОВ');
  }

  /* дуга ритма: публикации за 7 дней против цели 3 в неделю */
  function gauge(last7) {
    var target = 3;
    var score = Math.max(0, Math.min(100, Math.round((last7 / target) * 100)));
    var R = 58, w = 11, cx = 80, cy = 84;
    var from = Math.PI, to = Math.PI * 2;
    function pt(a) { return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) }; }
    function arc(a1, a2, color, width) {
      var p1 = pt(a1), p2 = pt(a2);
      var large = (a2 - a1) > Math.PI ? 1 : 0;
      return '<path d="M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) +
        ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1) +
        '" fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round"></path>';
    }
    var end = from + (score / 100) * Math.PI;
    var label = score >= 100 ? 'ровный' : score >= 60 ? 'держится' : score >= 30 ? 'просел' : 'стоит';
    var color = score >= 60 ? '#8ED08A' : (score >= 30 ? '#E8A54F' : '#E07A6A');
    return '<div class="an-gauge">' +
      '<svg width="160" height="112" viewBox="0 0 160 112">' +
        arc(from, to, 'rgba(236,226,206,.10)', w) +
        (score > 0 ? arc(from, end, color, w) : '') +
        '<circle cx="' + pt(end).x.toFixed(1) + '" cy="' + pt(end).y.toFixed(1) + '" r="3.4" fill="' + color + '"></circle>' +
        '<text x="80" y="66" text-anchor="middle" font-size="27" fill="#F4F1EA" font-family="Georgia,serif">' + score + '</text>' +
        '<text x="80" y="86" text-anchor="middle" font-size="10.5" fill="#8A857C">' + label + '</text>' +
        '<text x="18" y="106" font-size="9" fill="#6F6A61" font-family="monospace">0</text>' +
        '<text x="136" y="106" font-size="9" fill="#6F6A61" font-family="monospace">100</text>' +
      '</svg>' +
      '<p class="an-cap">' + last7 + ' за 7 дней · цель 3 в неделю</p>' +
    '</div>';
  }

  /* кольцо плана недели */
  function ring(done, total) {
    var pct = total ? Math.min(1, done / total) : 0;
    var R = 44, C = 2 * Math.PI * R;
    return '<div class="an-ring">' +
      '<svg width="120" height="120" viewBox="0 0 120 120">' +
        '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="rgba(236,226,206,.10)" stroke-width="10"></circle>' +
        '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#E8A54F" stroke-width="10" stroke-linecap="round" ' +
          'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '" ' +
          'transform="rotate(-90 60 60)"></circle>' +
        '<text x="60" y="58" text-anchor="middle" font-size="20" fill="#F4F1EA" font-family="Georgia,serif">' + done + '/' + total + '</text>' +
        '<text x="60" y="76" text-anchor="middle" font-size="9" fill="#8A857C" font-family="monospace">ПЛАН</text>' +
      '</svg>' +
      '<p class="an-cap">' + (pct >= 1 ? 'план недели закрыт' : 'осталось ' + (total - done) + ' до плана') + '</p>' +
    '</div>';
  }

  function tiles(t, daily) {
    var series = daily.map(function (x) { return x.n; });
    var flat = daily.map(function () { return 0; });
    var line = '<svg viewBox="0 0 120 34" preserveAspectRatio="none"><line x1="0" y1="26" x2="120" y2="26" stroke="rgba(236,226,206,.10)" stroke-width="1"/></svg>';
    return '<div class="an-tiles">' +
      tile('Бренды', t.brands, plural(t.brands, 'в работе'), line) +
      tile('Цели', t.goals, plural(t.goals, 'разборов'), line) +
      tile('Посты', t.posts, plural(t.posts, 'написано'), line) +
      tile('Публикации', t.published, plural(t.published, 'вышло'), spark(series, '#8ED08A')) +
      tile('Каналы', t.channels, plural(t.channels, 'привязано'), line) +
    '</div>';
  }
  function tile(label, n, hint, sparkSvg) {
    return '<div class="an-tile"><p class="l">' + label + '</p>' +
      '<div class="n">' + mon(n) + '<small>' + hint + '</small></div>' + sparkSvg + '</div>';
  }

  function insights(list) {
    var good = list.filter(function (x) { return x.kind === 'good'; });
    var warn = list.filter(function (x) { return x.kind === 'warn'; });
    var miss = list.filter(function (x) { return x.kind === 'miss'; });
    function col(cls, title, items, mark) {
      var body = items.length
        ? items.map(function (i) { return '<p><span class="b">' + mark + '</span><span>' + esc(i.text) + '</span></p>'; }).join('')
        : '<p><span class="b">·</span><span>Пока нечего отметить</span></p>';
      return '<div class="col ' + cls + '"><h3>' + title + '</h3>' + body + '</div>';
    }
    return '<div class="an-ins">' +
      col('good', 'Что хорошо', good, '✓') +
      col('warn', 'Где споткнулись', warn, '!') +
      col('miss', 'Чего не хватает', miss, '·') +
    '</div>';
  }

  function partnerStrip(p) {
    if (!p) return '';
    return '<div class="an-partner">' +
      '<div><p class="k">Партнёрка</p><p class="v">' + esc(p.title) + ' <small>' + p.rate + '% · до ' + p.cap + ' ₽</small></p></div>' +
      '<div><p class="k">Клиентов</p><p class="v">' + p.paid_clients + '</p></div>' +
      '<div><p class="k">Копится</p><p class="v">' + mon(p.pending_rub) + ' ₽ <small>из 1 000 ₽</small></p></div>' +
      '<a href="/partner/cabinet">Открыть кабинет →</a>' +
    '</div>';
  }

  function activity(recent) {
    if (!recent.length) return '<p class="an-empty">Публикаций пока нет. Опубликуй первый пост — здесь появится история.</p>';
    return recent.map(function (r) {
      return '<div class="an-act">' +
        (r.brand ? '<span class="bd">' + esc(r.brand) + '</span>' : '') +
        '<span class="t">' + esc(r.title || 'Без заголовка') + '</span>' +
        '<span class="d">' + dateRu(r.published_at) + '</span>' +
      '</div>';
    }).join('');
  }

  function paint(d) {
    root.innerHTML =
      partnerStrip(d.partner) +
      tiles(d.totals, d.daily) +
      '<div class="an-grid">' +
        '<div class="an-card"><h2>Публикации за 30 дней</h2><p class="cap">что вышло в люди</p>' + bigChart(d.daily) + '</div>' +
        '<div class="an-cols-right">' +
          '<div class="an-card"><h2>По брендам</h2><p class="cap">у кого что выходит</p>' + donut(d.brands, d.totals.published) + '</div>' +
          '<div class="an-card"><h2>Стол и улица</h2><p class="cap">что вышло, что ещё в столе</p>' + deskStreet(d.totals) + '</div>' +
          '<div class="an-card"><h2>Ритм и план</h2><p class="cap">последние 7 дней · норма 3 публикации</p>' +
            '<div class="an-pair">' + gauge(d.counts.last7) + ring(Math.min(3, d.counts.last7), 3) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      insights(d.insights) +
      '<div class="an-grid" style="margin-top:16px">' +
        '<div class="an-card"><h2>Последние публикации</h2><p class="cap">свежее сверху</p>' + activity(d.recent) + '</div>' +
        '<div class="an-card"><h2>Бренды</h2><p class="cap">цели · посты · публикации · каналы</p>' + brandsTable(d.brands) + '</div>' +
      '</div>';
  }

  function brandsTable(rows) {
    if (!rows.length) return '<p class="an-empty">Брендов пока нет. Создай первый на странице «К брендам».</p>';
    return '<table style="width:100%;border-collapse:collapse;font-size:12.5px">' +
      '<tr style="color:#6F6A61;font:500 9px/1 monospace;letter-spacing:.12em;text-transform:uppercase">' +
        '<td style="padding:6px 0">Бренд</td><td>Цели</td><td>Посты</td><td>Публ.</td><td>Каналы</td></tr>' +
      rows.map(function (b) {
        var dim = b.posts === 0 ? 'opacity:.55' : '';
        return '<tr style="border-top:1px solid rgba(236,226,206,.06);' + dim + '">' +
          '<td style="padding:9px 0">' + esc(b.name) + '</td>' +
          '<td>' + b.goals + '</td><td>' + b.posts + '</td>' +
          '<td style="color:#E8A54F">' + b.published + '</td>' +
          '<td style="color:' + (b.channels ? '#8ED08A' : '#8A857C') + '">' + b.channels + '</td></tr>';
      }).join('') + '</table>';
  }

  fetch('/api/analytics/deep', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) { root.innerHTML = '<p class="an-empty">Нужен вход, чтобы увидеть аналитику.</p>'; return; }
      paint(d);
      if (window.ggSkeletonDone) window.ggSkeletonDone();
    })
    .catch(function () { root.innerHTML = '<p class="an-empty">Не удалось собрать цифры. Обнови страницу.</p>'; });
})();
</script>

<script src="/theme.js" defer></script>
<script src="/topline.js" defer></script>
<script src="/rail.js" defer></script>
<script src="/legal.js" defer></script>
</body>

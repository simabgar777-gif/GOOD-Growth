<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title data-i18n="analytics.meta.title">Аналитика — GOOD Growth</title>
  <style>
  :root{
    --pg-bg:#08090A; --pg-surface:#0E0F12; --pg-surface2:#111216;
    --pg-line:rgba(255,255,255,.06); --pg-line2:rgba(255,255,255,.10);
    --pg-fg:#F4F4F5; --pg-fg2:#A1A1AA; --pg-fg3:#8B8B95;
    --pg-copper:#E8A54F; --pg-copper-lt:#F3C583; --pg-copper-dp:#C97B3C;
    --pg-grad:linear-gradient(180deg,#F0BC72,#E8A54F 55%,#DF9A48);
    --pg-ink:#1B1206;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font:16px/1.6 'Segoe UI',Tahoma,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 22px 60px}
  .back{color:var(--pg-fg3);text-decoration:none;font-size:14px}
  .back:hover{color:var(--pg-copper)}
  h1{font:400 32px/1.15 Georgia,serif;margin:14px 0 8px}
  .sub{color:var(--pg-fg2);margin:0 0 26px}
  .totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:30px}
  .tcard{background:var(--pg-surface);border:1px solid var(--pg-line2);border-radius:12px;padding:14px 16px}
  .tcard .n{font:600 30px/1 Georgia,serif;color:var(--pg-copper)}
  .tcard .l{color:var(--pg-fg3);font-size:13px;margin-top:4px}
  .tcard.coral .n{color:var(--pg-copper-lt)}
  table{width:100%;border-collapse:collapse;background:var(--pg-surface);border:1px solid var(--pg-line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:12px 14px;font-size:14.5px;border-bottom:1px solid var(--pg-line)}
  th{font:500 11.5px/1 Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--pg-fg3);background:var(--pg-surface2)}
  tr:last-child td{border-bottom:0}
  td.n{font-weight:600;color:var(--pg-copper)}
  td.muted{color:var(--pg-fg3)}
  .name{font-weight:600}
  .empty{border:1px dashed var(--pg-line2);border-radius:12px;padding:30px;text-align:center;color:var(--pg-fg3)}
  .hint{color:var(--pg-fg3);font-size:13px;margin-top:16px}
  @media (max-width:640px){th,td{padding:9px 10px;font-size:13px}}</style>
<link rel="stylesheet" href="/style-c.css"></head>
<body>
  <div class="wrap">
    <a class="back" href="/partner" data-i18n="analytics.back.partners">Партнёрам · ← К брендам</a> · <a class="back" href="/partner/team" data-i18n="analytics.back.team">Команда</a>
    <h1 data-i18n="analytics.h1">Аналитика</h1>
    <p class="sub" data-i18n="analytics.sub">Сводка по всем брендам: цели, посты, публикации. Обновляется мгновенно из базы.</p>
    <div class="totals" id="totals"></div>
    <div id="tableWrap"></div>
    <p class="hint" data-i18n="analytics.hint">Публикация считается по кнопке «Опубликовать». Каналы — привязанные Telegram-каналы бренда.</p>
  </div>
  <script src="/i18n/i18n.js"></script>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDate = (s) => { if (!s) return '—'; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? '—' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); };
    async function load() {
      try {
        const d = await (await fetch('/api/analytics')).json();
        const t = d.totals;
        document.getElementById('totals').innerHTML =
          tcard(t.brands, ggT('analytics.tile.brands','брендов')) + tcard(t.goals, ggT('analytics.tile.goals','целей')) +
          tcard(t.posts, ggT('analytics.tile.posts','постов')) + '<div class="tcard coral"><div class="n">' + t.published + '</div><div class="l">' + ggT('analytics.tile.published','публикаций') + '</div></div>' +
          tcard(t.channels, ggT('analytics.tile.channels','каналов'));
        const rows = d.brands.map((b) =>
          '<tr><td class="name">' + esc(b.name) + '</td>' +
          '<td class="n">' + b.goals + '</td><td class="n">' + b.posts + '</td>' +
          '<td class="n" style="color:var(--coral)">' + b.published + '</td>' +
          '<td class="muted">' + b.channels + '</td>' +
          '<td class="muted">' + fmtDate(b.last_published_at) + '</td></tr>').join('');
        document.getElementById('tableWrap').innerHTML = d.brands.length
          ? '<table><thead><tr><th>' + ggT('analytics.th.brand','Бренд') + '</th><th>' + ggT('analytics.th.goals','Цели') + '</th><th>' + ggT('analytics.th.posts','Посты') + '</th><th>' + ggT('analytics.th.published','Публикации') + '</th><th>' + ggT('analytics.th.channels','Каналы') + '</th><th>' + ggT('analytics.th.last','Последняя публ.') + '</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">' + ggT('analytics.empty','Брендов пока нет. Создай первый на странице «К брендам» — и здесь появится статистика.') + '</div>';
      } catch (e) {
        document.getElementById('tableWrap').innerHTML = '<div class="empty">' + ggT('analytics.err','Не удалось загрузить: ') + esc(e.message) + '</div>';
      }
    }
    function tcard(n, l) { return '<div class="tcard"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
    load();
  </script>
<script src="/gg-header.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Аналитика — GOOD Growth</title>
  <style>
    :root { --bg:#0b0f1e; --surface:#121830; --surface2:#171e38; --ink:#eceaf4; --muted:#a7abc8;
      --faint:#737aa0; --hair:rgba(236,234,244,.14); --mint:#52d6c4; --coral:#ff9a7a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 'Segoe UI',Tahoma,sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 22px 60px; }
    .back { color: var(--faint); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--ink); }
    h1 { font: 400 32px/1.15 Georgia, serif; margin: 14px 0 8px; }
    .sub { color: var(--muted); margin: 0 0 26px; }
    .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 30px; }
    .tcard { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px; }
    .tcard .n { font: 600 30px/1 Georgia, serif; color: var(--mint); }
    .tcard .l { color: var(--faint); font-size: 13px; margin-top: 4px; }
    .tcard.coral .n { color: var(--coral); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; font-size: 14.5px; border-bottom: 1px solid var(--hair); }
    th { font: 500 11.5px/1 'Consolas',monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); background: var(--surface2); }
    tr:last-child td { border-bottom: 0; }
    td.n { font-weight: 600; color: var(--mint); }
    td.muted { color: var(--faint); }
    .name { font-weight: 600; }
    .empty { border: 1px dashed var(--hair); border-radius: 12px; padding: 30px; text-align: center; color: var(--faint); }
    .hint { color: var(--faint); font-size: 13px; margin-top: 16px; }
    @media (max-width: 640px) { th, td { padding: 9px 10px; font-size: 13px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/partner">← К брендам</a>
    <h1>Аналитика</h1>
    <p class="sub">Сводка по всем брендам: цели, посты, публикации. Обновляется мгновенно из базы.</p>
    <div class="totals" id="totals"></div>
    <div id="tableWrap"></div>
    <p class="hint">Публикация считается по кнопке «Опубликовать». Каналы — привязанные Telegram-каналы бренда.</p>
  </div>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDate = (s) => { if (!s) return '—'; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? '—' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); };
    async function load() {
      try {
        const d = await (await fetch('/api/analytics')).json();
        const t = d.totals;
        document.getElementById('totals').innerHTML =
          tcard(t.brands, 'брендов') + tcard(t.goals, 'целей') +
          tcard(t.posts, 'постов') + '<div class="tcard coral"><div class="n">' + t.published + '</div><div class="l">публикаций</div></div>' +
          tcard(t.channels, 'каналов');
        const rows = d.brands.map((b) =>
          '<tr><td class="name">' + esc(b.name) + '</td>' +
          '<td class="n">' + b.goals + '</td><td class="n">' + b.posts + '</td>' +
          '<td class="n" style="color:var(--coral)">' + b.published + '</td>' +
          '<td class="muted">' + b.channels + '</td>' +
          '<td class="muted">' + fmtDate(b.last_published_at) + '</td></tr>').join('');
        document.getElementById('tableWrap').innerHTML = d.brands.length
          ? '<table><thead><tr><th>Бренд</th><th>Цели</th><th>Посты</th><th>Публикации</th><th>Каналы</th><th>Последняя публ.</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">Брендов пока нет. Создай первый на странице «К брендам» — и здесь появится статистика.</div>';
      } catch (e) {
        document.getElementById('tableWrap').innerHTML = '<div class="empty">Не удалось загрузить: ' + esc(e.message) + '</div>';
      }
    }
    function tcard(n, l) { return '<div class="tcard"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
    load();
  </script>
</body>
</html>

  <body>
    <div id="root"></div>
  <div id="partnerModal" style="position:fixed;inset:0;background:rgba(9,9,11,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px">
<div style="background:#18181b;color:#f4f4f5;max-width:430px;width:100%;border:1px solid #3f3f46;border-radius:16px;padding:28px 26px;position:relative">
<button id="partnerClose" style="position:absolute;top:12px;right:14px;background:none;border:0;color:#a1a1aa;font-size:22px;cursor:pointer;line-height:1" aria-label="Закрыть">&times;</button>
<p style="margin:0 0 6px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#fcd34d">Партнёрский путь</p>
<h3 style="margin:0 0 10px;font-size:22px;font-weight:600">Скоро откроется</h3>
<p style="margin:0 0 14px;color:#d4d4d8;line-height:1.55">Режим для агентств и бренд-менеджеров в разработке: несколько брендов, переключение в один клик, отдельная аналитика.</p>
<p style="margin:0 0 18px;color:#a1a1aa;line-height:1.5">А пока мастерская уже работает — начни со своего дела.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a href="/partner/info" style="display:inline-block;background:#fcd34d;color:#09090b;padding:10px 20px;border-radius:8px;font-weight:600;text-decoration:none">О партнёрской программе</a><a href="/app" style="display:inline-block;border:1px solid #52d6c4;color:#52d6c4;padding:10px 20px;border-radius:8px;font-weight:600;text-decoration:none">Открыть мастерскую</a></div>
</div></div>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest('a[href="#!partner"]');
  if(a){e.preventDefault();document.getElementById('partnerModal').style.display='flex';}
  if(e.target.id==='partnerModal'||e.target.id==='partnerClose'){document.getElementById('partnerModal').style.display='none';}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('partnerModal').style.display='none';}});
</script>
</body>

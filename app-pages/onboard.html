<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Шаг 1 · Твоя цель — GOOD Growth</title>
  <style>
    :root { --bg:#f6faf7; --surface:#ffffff; --surface2:#eef5f0; --ink:#122b21; --muted:#4c6b5c;
      --faint:#6b8a7b; --hair:rgba(18,43,33,.13); --hair-soft:rgba(18,43,33,.06);
      --green:#1e7a56; --green-deep:#0b3d2e; --sun:#f0b429; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 'Segoe UI',Tahoma,sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 34px 22px 70px; }
    .back { color: var(--faint); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--ink); }
    .steps-line { display: flex; gap: 8px; margin: 18px 0 26px; }
    .step-dot { flex:1; height: 4px; border-radius: 999px; background: var(--surface2); }
    .step-dot.on { background: var(--green); }
    .kicker { font: 500 12px/1 'Consolas',monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--green); margin: 0 0 10px; }
    h1 { font: 400 30px/1.15 Georgia, serif; margin: 0 0 10px; }
    .sub { color: var(--muted); margin: 0 0 26px; }
    .free-pill { display:inline-flex; align-items:center; gap:8px; background: rgba(30,122,86,.1); color: var(--green); font: 600 13px/1 inherit; padding: 7px 14px; border-radius: 999px; margin-bottom: 18px; }
    form { background: var(--surface); border: 1px solid var(--hair-soft); border-radius: 14px; padding: 22px; }
    label { display: block; font: 500 12px/1 'Consolas',monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
    input[type="text"] { width:100%; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; font: inherit; margin-bottom: 16px; }
    input:focus { outline: 2px solid var(--green); border-color: var(--green); }
    .mic-row { display: flex; gap: 10px; align-items: center; }
    .mic-btn { width:46px; height:46px; border-radius:50%; border:1px solid var(--green); background:var(--green); color:#fff; font-size:18px; cursor:pointer; flex:0 0 auto; }
    .btn { display:block; width:100%; padding: 15px; border-radius: 999px; background: var(--green); color:#fff; font: 600 16px/1 inherit; border: 0; cursor: pointer; margin-top: 6px; }
    .btn:disabled { opacity: .55; cursor: wait; }
    .status { min-height: 22px; font: 13px/1.4 'Consolas',monospace; color: var(--muted); margin: 12px 0 0; }
    .err { color: #c0392b; }
    .or { text-align:center; color: var(--faint); font-size: 13px; margin: 14px 0; }
    .quick-link { text-align:center; }
    .quick-link a { color: var(--green); font-size: 14.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← На лендинг</a>
    <div class="steps-line"><span class="step-dot on"></span><span class="step-dot"></span><span class="step-dot"></span><span class="step-dot"></span></div>
    <span class="free-pill">Бесплатно · без регистрации · первый пост за 10 минут</span>
    <p class="kicker">ШАГ 1 ИЗ 4</p>
    <h1>Расскажи о своём деле</h1>
    <p class="sub">5 коротких вопросов — и GOOD Growth соберёт стратегию, посты и картинки. Печатаешь или говоришь голосом.</p>

    <form id="onboardForm" novalidate>
      <label for="d_what">Что ты делаешь?</label>
      <div class="mic-row">
        <input type="text" id="d_what" maxlength="120" placeholder="«Мастерская ремонта велосипедов»" autocomplete="off" style="flex:1" />
        <button class="mic-btn" id="mic1" type="button" title="Сказать голосом" aria-label="Сказать голосом">🎙</button>
      </div>
      <label for="d_where">Где ты находишься?</label>
      <input type="text" id="d_where" maxlength="120" placeholder="«Москва» или «Онлайн по России»" autocomplete="off" />
      <label for="d_who">Кто твой клиент?</label>
      <input type="text" id="d_who" maxlength="120" placeholder="«Взрослые, которые хотят научиться играть»" autocomplete="off" />
      <label for="d_want">Чего ты хочешь?</label>
      <input type="text" id="d_want" maxlength="120" placeholder="«Чтобы узнали и записались»" autocomplete="off" />
      <button class="btn" id="go" type="submit">Получить стратегию →</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="or">— или —</p>
    <p class="quick-link"><a id="quickLink" href="/app">Написать цель одной фразой →</a></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ['d_what', 'd_where', 'd_who', 'd_want'];
    /* restore draft */
    try {
      const draft = JSON.parse(sessionStorage.getItem('gg_onboard') || '{}');
      fields.forEach((f) => { if (draft[f]) $(f).value = draft[f]; });
      fields.forEach((f) => $(f).addEventListener('input', () => {
        const d = {};
        fields.forEach((k) => { d[k] = $(k).value; });
        sessionStorage.setItem('gg_onboard', JSON.stringify(d));
      }));
    } catch (e) {}
    /* quick link carries filled fields */
    $('quickLink').addEventListener('click', () => {
      const d = {};
      fields.forEach((k) => { d[k] = $(k).value.trim(); });
      sessionStorage.setItem('gg_onboard_quick', JSON.stringify(d));
    });

    $('onboardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const details = {};
      fields.forEach((k) => { details[k.slice(2)] = $(k).value.trim(); });
      if (!details.what || details.what.length < 2) { status('Расскажи хотя бы, что ты делаешь.', true); return; }
      $('go').disabled = true;
      status('Собираю стратегию… это займёт до минуты.');
      try {
        const r = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ details, quick: false }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Не получилось. Попробуй ещё раз.');
        sessionStorage.removeItem('gg_onboard');
        location.href = '/app/strategy?goal=' + d.id;
      } catch (err) {
        status(err.message, true);
        $('go').disabled = false;
      }
    });
    function status(t, isErr) { const el = $('status'); el.textContent = t; el.className = 'status' + (isErr ? ' err' : ''); }
    /* simple voice: Web Speech if available */
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null, activeBtn = null;
      document.querySelectorAll('.mic-btn').forEach((b) => {
        b.addEventListener('click', () => {
          const input = b.parentElement.querySelector('input') || b.closest('div').nextElementSibling;
          if (activeBtn === b) { rec.stop(); return; }
          if (activeBtn) rec.stop();
          activeBtn = b;
          rec = new SR(); rec.lang = 'ru-RU'; rec.continuous = true; rec.interimResults = false;
          let base = input.value ? input.value + ' ' : '';
          rec.onresult = (e) => { for (const res of e.results) { base += res[0].transcript + ' '; } input.value = base.trim(); };
          rec.onend = () => { activeBtn = null; };
          rec.onerror = () => { activeBtn = null; };
          rec.start();
        });
      });
    } else {
      document.querySelectorAll('.mic-btn').forEach((b) => b.style.display = 'none');
    }
  </script>
</body>
</html>

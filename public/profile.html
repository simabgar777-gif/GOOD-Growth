<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль — GOOD Growth</title>
<link rel="icon" href="/favicon-32x32.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8f4;color:#1c2419;padding:24px 24px 60px}
.wrap{max-width:980px;margin:0 auto}
.card{background:#fff;border:1px solid #e3e9de;border-radius:20px;padding:28px 30px}
.hero{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#3f9d63,#52d6c4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex-shrink:0}
.hero h1{font-size:24px;letter-spacing:-.01em}
.hero .mail{color:#5c6b57;font-size:15px}
.hero .since{color:#7a8775;font-size:13px}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7a8775;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card h3{font-size:16.5px;margin-bottom:8px}
.mut{color:#5c6b57;font-size:14px}
.tiny{color:#7a8775;font-size:12.5px}
.badge{display:inline-block;background:#e2efe4;color:#2f7a4c;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.bar{height:8px;background:#eef3ec;border-radius:99px;margin:6px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:#3f9d63;border-radius:99px}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;align-items:center;justify-content:space-between;border:1px solid #e3e9de;border-radius:12px;padding:10px 14px;text-decoration:none;color:inherit;font-weight:600;font-size:14.5px}
.bitem span:first-child{display:flex;align-items:center;gap:9px}
.dotc{width:10px;height:10px;border-radius:50%;background:#52d6c4;flex-shrink:0}
.bitem:hover{border-color:#3f9d63}
.trow{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.5px}
.trow b{font-weight:700}
.rolechip{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.rc-owner{background:#e2efe4;color:#2f7a4c}
.rc-approver{background:#e9f0fb;color:#2d5fa8}
.rc-publisher{background:#fdf1e2;color:#a4652a}
.rc-creator{background:#f1ede4;color:#7a6a45}
.rc-pending{background:#f7f0e0;color:#8a6d1f}
button,.btn{background:#3f9d63;color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border:0;border-radius:11px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#2f7a4c}
button.ghost{background:none;color:#5c6b57;border:1px solid #d8e2d4}
button.ghost:hover{color:#b3402f;border-color:#e8c4ba;background:#fdf7f5}
button:disabled{opacity:.6;cursor:wait}
input,select{width:100%;padding:10px 13px;border:1.5px solid #d8e2d4;border-radius:11px;font:inherit;font-size:14.5px;background:#fbfdfa;color:#1c2419}
input:focus,select:focus{outline:none;border-color:#3f9d63;background:#fff}
label{font-size:12.5px;font-weight:700;color:#3c4a38;display:block;margin:10px 0 4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:13.5px;margin-top:8px;display:none;border-radius:9px;padding:8px 12px}
.status.err{display:block;background:#f9e9e6;color:#b3402f}
#pwHint.bad{color:#b3402f;font-weight:700}
.status.ok{display:block;background:#e3f2e6;color:#2f7a4c}
.hist{list-style:none}
.hist li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #eef3ec;font-size:14px}
.hist li:last-child{border-bottom:0}
.hist .d{color:#7a8775;font-size:12.5px;white-space:nowrap}
.empty{color:#7a8775;font-size:14px;border:1px dashed #d8e2d4;border-radius:12px;padding:16px;text-align:center}
@media(max-width:820px){.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start;gap:12px}.frow{grid-template-columns:1fr}.card{padding:22px 18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="root"><p class="mut">Загружаю профиль…</p></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var PLAN_NAMES={start:'Старт',growth:'Рост',pro:'Про',agency:'Агентство',unlimited:'Безлимит'};
  var ROLE_NAMES={owner:'Владелец',approver:'Утверждающий',publisher:'Публикатор',creator:'Создатель'};
  var ROLE_CLS={owner:'rc-owner',approver:'rc-approver',publisher:'rc-publisher',creator:'rc-creator'};
  function fmtDate(iso){try{var d=new Date(iso);if(isNaN(d))return '';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}catch(e){return '';}}
  function fmtDT(iso){try{var d=new Date(iso);if(isNaN(d))return '';return d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
  function inf(n){return n>=9999?'∞':n;}
  function stat(el,t,ok){el.className='status '+(ok?'ok':'err');el.textContent=t;}

  fetch('/api/profile',{headers:{'Cache-Control':'no-cache'}}).then(function(r){if(r.status===401){location.href='/login?next='+encodeURIComponent('/profile');throw new Error('auth');}return r.json();}).then(function(P){
    var u=P.user,pl=P.plan,usage=P.usage;
    var letter=(u.name||u.email||'?').trim().charAt(0).toUpperCase();
    var root=$('root');
    var h='<div class="hero"><div class="avatar">'+esc(letter)+'</div><div><h1>'+esc(u.name||'Без имени')+'</h1><div class="mail">'+esc(u.email)+'</div><div class="since">В команде с '+esc(fmtDate(u.created_at)||'—')+'</div></div></div>';

    h+='<h2>Личные данные</h2><div class="card"><form id="nameForm" style="max-width:420px"><label for="nm">Имя</label><input id="nm" maxlength="80" value="'+esc(u.name||'')+'"><button type="submit" id="nmBtn">Сохранить имя</button><div class="status" id="nmStat"></div></form></div>';

    var ub=P.usage_brands,uc=P.usage_channels,up=P.usage_posts;
    function bar(n,max){var pct=max>0&&max<9999?Math.min(100,Math.round(n*100/max)):0;return '<div class="bar"><i style="width:'+pct+'%"></i></div>';}
    h+='<h2>Тариф и лимиты</h2><div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Тариф: <span class="badge">'+esc(PLAN_NAMES[pl.code]||pl.code)+'</span></h3><a class="btn" href="/pricing">Сменить тариф</a></div>'+
      '<div style="margin-top:14px"><div class="mut"><b>'+ub.used+' из '+inf(ub.max)+'</b> брендов</div>'+bar(ub.used,ub.max)+
      '<div class="mut"><b>'+uc.used+' из '+inf(uc.max)+'</b> каналов</div>'+bar(uc.used,uc.max)+
      '<div class="mut"><b>'+up.used+' из '+inf(up.max)+'</b> постов сегодня</div>'+bar(up.used,up.max)+
      '</div><div class="tiny">Лимиты обновляются сразу после смены тарифа.</div></div>';

    h+='<h2>Мои бренды</h2><div class="card">';
    if(P.brands.length){h+='<div class="blist">'+P.brands.map(function(b){return '<a class="bitem" href="/app?brand='+encodeURIComponent(b.name)+'"><span><span class="dotc"></span>'+esc(b.name)+'</span><span class="tiny">'+b.posts_count+' пост(ов)</span></a>';}).join('')+'</div>';}
    else{h+='<div class="empty">Брендов пока нет.</div>';}
    h+='<div style="margin-top:12px"><a class="btn ghost" href="/partner" style="color:#2f7a4c;border-color:#cfe3d3">+ Добавить бренд</a></div></div>';

    h+='<h2>Команда</h2><div class="card">';
    if(P.user.role==='owner'){
      if(P.team.length){h+=P.team.map(function(m){var st=m.invite_status;var chip=st==='pending'?'<span class="rolechip rc-pending">Приглашение не принято</span>':(st==='accepted'?'<span class="rolechip rc-owner">В команде</span>':'');return '<div class="trow"><b>'+esc(m.name)+'</b><span class="rolechip '+(ROLE_CLS[m.role]||'rc-creator')+'">'+esc(ROLE_NAMES[m.role]||m.role)+'</span>'+chip+'</div>';}).join('');}
      else{h+='<div class="empty">Ты пока один. Пригласи помощников.</div>';}
      h+='<div style="margin-top:12px"><a class="btn ghost" href="/partner/team" style="color:#2f7a4c;border-color:#cfe3d3">Управлять командой</a></div>';
    }else{
      h+='<div class="trow"><span class="rolechip '+(ROLE_CLS[P.role]||'rc-creator')+'">'+esc(ROLE_NAMES[P.role]||P.role)+'</span><span class="mut">— твоя роль в команде GOOD Growth</span></div><div style="margin-top:10px"><a class="btn ghost" href="/partner/team" style="color:#2f7a4c;border-color:#cfe3d3">Вся команда</a></div>';
    }
    h+='</div>';

    var s=P.settings;
    h+='<h2>Настройки</h2><div class="grid">';
    h+='<div class="card"><h3>Уведомления и приватность</h3>';
    if(s){
      h+='<label for="ntf">Уведомления</label><select id="ntf"><option value="email"'+(s.notifications==='email'?' selected':'')+'>На email</option><option value="telegram"'+(s.notifications==='telegram'?' selected':'')+'>В Telegram</option><option value="off"'+(s.notifications==='off'?' selected':'')+'>Выключено</option></select>'+
      '<label for="prv">Кто видит профиль</label><select id="prv"><option value="all"'+(s.privacy==='all'?' selected':'')+'>Все</option><option value="team"'+(s.privacy==='team'?' selected':'')+'>Только команда</option><option value="nobody"'+(s.privacy==='nobody'?' selected':'')+'>Никто</option></select>'+
      '<div style="margin-top:12px"><button id="setBtn" class="ghost">Сохранить настройки</button></div><div class="status" id="setStat"></div>';
    }else{
      h+='<div class="empty">Смены тарифов ещё не было — настройки появятся после первого изменения тарифа.</div>';
    }
    h+='</div>';
    h+='<div class="card"><h3>Безопасность</h3><form id="passForm"><div class="frow"><div><label for="p0">Текущий пароль</label><input id="p0" type="password" autocomplete="current-password"></div><div><label for="p1">Новый пароль</label><input id="p1" type="password" autocomplete="new-password" placeholder="Минимум 8 символов"><div class="hint" id="pwHint" style="font-size:12.5px;color:#7a8775;margin-top:3px">Только английские буквы, цифры и символы. Храним только хэш.</div></div></div><div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap"><button type="submit" id="pBtn">Сменить пароль</button><button type="button" id="outAll" class="ghost">Выйти на других устройствах</button></div><div class="status" id="pStat"></div></form></div>';
    h+='</div>';

    h+='<h2>История</h2><div class="grid"><div class="card"><h3>Мои посты</h3>';
    if(P.posts.length){h+='<ul class="hist">'+P.posts.map(function(p){return '<li><span>'+((p.published_at)?'📣':'📝')+'</span><span>'+esc(p.title)+'</span><span class="d">'+esc(fmtDT(p.published_at||p.created_at))+'</span></li>';}).join('')+'</ul>';}
    else{h+='<div class="empty">Постов ещё нет.</div>';}
    h+='</div><div class="card"><h3>Смены тарифов</h3>';
    if(P.subs.length){h+='<ul class="hist">'+P.subs.map(function(x){return '<li><span class="rolechip rc-owner">'+esc(PLAN_NAMES[x.plan_code]||x.plan_code)+'</span><span class="d">'+esc(fmtDT(x.created_at))+'</span></li>';}).join('')+'</ul>';}
    else{h+='<div class="empty">Смен ещё не было.</div>';}
    h+='</div></div>';
    root.innerHTML=h;

    /* name form */
    $('nameForm').addEventListener('submit',function(e){
      e.preventDefault();var b=$('nmBtn');b.disabled=true;
      fetch('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('nm').value})})
        .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
        .then(function(res){b.disabled=false;if(res.status===200){stat($('nmStat'),'Имя сохранено.',true);try{var c=JSON.parse(sessionStorage.getItem('gg_user')||'{}');c.name=res.d.user.name;sessionStorage.setItem('gg_user',JSON.stringify(c));}catch(e){}}else{stat($('nmStat'),res.d.error||'Ошибка',false);}})
        .catch(function(){b.disabled=false;stat($('nmStat'),'Сервер не отвечает.',false);});
    });

    /* password form */
    $('passForm').addEventListener('submit',function(e){
      e.preventDefault();var b=$('pBtn');
      try{$('p1').addEventListener('input',function(){var h=document.getElementById('pwHint');if(h)h.classList.toggle('bad',this.value.length>0&&this.value.length<8);});}catch(err){} /* O37 */
      var p0=$('p0').value,p1=$('p1').value;
      if(p1.length<8){stat($('pStat'),'Новый пароль — минимум 8 символов.',false);return;}
      if(!/^[A-Za-z0-9!@#$%^&*_+\-=.,?;:'"\(\)\[\]{}<>\\|\/~`\s]+$/.test(p1)){stat($('pStat'),'Пароль может содержать только английские буквы, цифры и символы',false);return;} /* O37 */
      b.disabled=true;
      fetch('/api/profile/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:p0,next:p1})})
        .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
        .then(function(res){b.disabled=false;if(res.status===200){stat($('pStat'),'Пароль изменён. Другие сессии завершены.',true);$('p0').value='';$('p1').value='';}else{stat($('pStat'),res.d.error||'Ошибка',false);}})
        .catch(function(){b.disabled=false;stat($('pStat'),'Сервер не отвечает.',false);});
    });

    /* logout all */
    $('outAll').addEventListener('click',function(){
      if(!confirm('Завершить все сессии на других устройствах? Текущая останется активной.'))return;
      fetch('/api/profile/sessions',{method:'DELETE'}).then(function(){try{sessionStorage.removeItem('gg_user');}catch(e){}location.href='/';});
    });

    /* settings */
    var sb=$('setBtn');
    if(sb)sb.addEventListener('click',function(){
      sb.disabled=true;
      fetch('/api/profile/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notifications:$('ntf').value,privacy:$('prv').value})})
        .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
        .then(function(res){sb.disabled=false;if(res.status===200){stat($('setStat'),'Настройки сохранены.',true);}else{stat($('setStat'),res.d.error||'Ошибка',false);}})
        .catch(function(){sb.disabled=false;stat($('setStat'),'Сервер не отвечает.',false);});
    });
  }).catch(function(e){if(e.message!=='auth')$('root').innerHTML='<p class="mut">Профиль не загрузился. Обнови страницу.</p>';});
})();
</script>
</body>
</html>

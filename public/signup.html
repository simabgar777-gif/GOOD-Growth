<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — GOOD Growth</title>
<link rel="icon" href="/favicon-32x32.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8f4;color:#1c2419;padding:24px}
.page{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid #e3e9de;border-radius:20px;padding:40px 36px;max-width:520px;width:100%;text-align:center}
h1{font-size:26px;margin-bottom:12px;letter-spacing:-.01em}
p.sub{color:#5c6b57;font-size:15.5px}
form{margin-top:22px;display:flex;flex-direction:column;gap:12px;text-align:left}
label{font-size:13.5px;font-weight:700;color:#3c4a38}
input{width:100%;padding:12px 14px;border:1.5px solid #d8e2d4;border-radius:12px;font:inherit;font-size:15px;background:#fbfdfa;color:#1c2419}
input:focus{outline:none;border-color:#3f9d63;background:#fff}
.hint{font-size:12.5px;color:#7a8775;margin-top:3px}
button.btn{margin-top:6px;background:#3f9d63;color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border:0;border-radius:12px;cursor:pointer;font-family:inherit}
button.btn:hover{background:#2f7a4c}
button.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14.5px;border-radius:10px;padding:10px 14px;display:none;text-align:left}
.msg.err{display:block;background:#f9e9e6;color:#b3402f}
.msg.ok{display:block;background:#e3f2e6;color:#2f7a4c}
.alt{margin-top:18px;font-size:14px;color:#5c6b57}
.alt a{color:#2f7a4c;font-weight:600;text-decoration:none}
.alt a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="page"><div class="card">
  <h1>Создать аккаунт</h1>
  <p class="sub">Тридцать секунд — и у тебя есть своя мастерская роста.</p>
  <form id="signupForm" novalidate>
    <div><label for="name">Имя</label><input id="name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="Как к тебе обращаться"></div>
    <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
    <div><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Минимум 8 символов">
      <div class="hint">Минимум 8 символов. Храним только хэш — сам пароль не увидит даже сервер.</div></div>
    <button class="btn" type="submit" id="submitBtn">Создать аккаунт</button>
  </form>
  <div class="msg" id="msg"></div>
  <p class="alt">Уже с нами? <a href="/login">Войти</a></p>
</div></div>
<script>
(function(){
  var f=document.getElementById('signupForm'),m=document.getElementById('msg'),b=document.getElementById('submitBtn');
  var NAMES={growth:'Рост',pro:'Про',agency:'Агентство',unlimited:'Безлимит'};
  var qp=null;try{qp=new URLSearchParams(location.search).get('plan');if(qp)sessionStorage.setItem('gg_plan',qp);}catch(e){}
  try{var nx=new URLSearchParams(location.search).get('next');if(nx&&nx.charAt(0)==='/'&&nx.charAt(1)!=='/'&&!sessionStorage.getItem('gg_after_login'))sessionStorage.setItem('gg_after_login',nx);}catch(e){}
  if(qp&&NAMES[qp])show('Тариф выбран: '+NAMES[qp]+'. Создай аккаунт — и подключим его.',true);
  function show(t,ok){m.className='msg '+(ok?'ok':'err');m.textContent=t;}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    m.className='msg';m.textContent='';
    var email=f.email.value.trim(),password=f.password.value,name=f.name.value.trim();
    if(!email){show('Укажи email.',false);return;}
    if(password.length<8){show('Пароль слишком короткий — минимум 8 символов.',false);return;}
    b.disabled=true;
    fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password,name:name})})
      .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
      .then(function(res){
        if(res.status===200&&res.d&&res.d.ok){try{sessionStorage.setItem('gg_user',JSON.stringify(res.d.user));sessionStorage.setItem('gg_entered','1');sessionStorage.removeItem('gg_after_login');}catch(e){}var dest='/app/strategy';try{var gp=sessionStorage.getItem('gg_plan');sessionStorage.removeItem('gg_plan');if(gp&&gp!=='start')dest='/app/billing?plan='+gp;}catch(e){}location.href=dest;}
        else{b.disabled=false;show((res.d&&res.d.error)||'Не получилось. Проверь поля и попробуй ещё раз.',false);}
      })
      .catch(function(){b.disabled=false;show('Сервер не отвечает. Попробуй ещё раз.',false);});
  });
})();
</script>
<script src="/gg-header.js" defer></script>
</body>
</html>

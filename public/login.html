<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — GOOD Growth</title>
<link rel="icon" href="/favicon-32x32.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8f4;color:#1c2419;padding:24px}
.page{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid #e3e9de;border-radius:20px;padding:40px 36px;max-width:520px;width:100%;text-align:center}
h1{font-size:26px;margin-bottom:12px;letter-spacing:-.01em}
p.sub{color:#5c6b57;font-size:15.5px}
form{margin-top:22px;display:flex;flex-direction:column;gap:12px;text-align:left}
label{font-size:13.5px;font-weight:700;color:#3c4a38}
input{width:100%;padding:12px 14px;border:1.5px solid #d8e2d4;border-radius:12px;font:inherit;font-size:15px;background:#fbfdfa;color:#1c2419}
input:focus{outline:none;border-color:#3f9d63;background:#fff}
button.btn{margin-top:6px;background:#3f9d63;color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border:0;border-radius:12px;cursor:pointer;font-family:inherit}
button.btn:hover{background:#2f7a4c}
button.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14.5px;border-radius:10px;padding:10px 14px;display:none;text-align:left}
.msg.err{display:block;background:#f9e9e6;color:#b3402f}
.msg.ok{display:block;background:#e3f2e6;color:#2f7a4c}
.alt{margin-top:18px;font-size:14px;color:#5c6b57}
.alt a{color:#2f7a4c;font-weight:600;text-decoration:none}
.alt a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="page"><div class="card">
  <h1>Вход</h1>
  <p class="sub">С возвращением. Твоя мастерская ждёт.</p>
  <form id="loginForm" novalidate>
    <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
    <div><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
    <button class="btn" type="submit" id="submitBtn">Войти</button>
  </form>
  <div class="msg" id="msg"></div>
  <p class="alt">Впервые здесь? <a href="/signup">Создать аккаунт</a></p>
</div></div>
<script>
(function(){
  var f=document.getElementById('loginForm'),m=document.getElementById('msg'),b=document.getElementById('submitBtn');
  function show(t,ok){m.className='msg '+(ok?'ok':'err');m.textContent=t;}
  if (new URLSearchParams(location.search).get('registered')==='1') show('Аккаунт создан. Войди тем же email и паролем.',true);
  try{var lp=new URLSearchParams(location.search).get('plan');if(lp)sessionStorage.setItem('gg_plan',lp);}catch(e){}
  try{var nx=new URLSearchParams(location.search).get('next');if(nx&&nx.charAt(0)==='/'&&nx.charAt(1)!=='/'&&!sessionStorage.getItem('gg_after_login'))sessionStorage.setItem('gg_after_login',nx);}catch(e){}
  f.addEventListener('submit',function(e){
    e.preventDefault();
    m.className='msg';m.textContent='';
    var email=f.email.value.trim(),password=f.password.value;
    if(!email||!password){show('Заполни email и пароль.',false);return;}
    b.disabled=true;
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})})
      .then(function(r){return r.json().then(function(d){return{status:r.status,d:d};});})
      .then(function(res){
        if(res.status===200&&res.d&&res.d.ok){try{sessionStorage.setItem('gg_user',JSON.stringify(res.d.user));sessionStorage.setItem('gg_entered','1');}catch(e){}var dest='/app/strategy';try{var after=sessionStorage.getItem('gg_after_login');var gp=sessionStorage.getItem('gg_plan');sessionStorage.removeItem('gg_after_login');sessionStorage.removeItem('gg_plan');if(after)dest=after;else if(gp&&gp!=='start')dest='/app/billing?plan='+gp;}catch(e){}location.href=dest;}
        else{b.disabled=false;show((res.d&&res.d.error)||'Не получилось войти. Попробуй ещё раз.',false);}
      })
      .catch(function(){b.disabled=false;show('Сервер не отвечает. Попробуй ещё раз.',false);});
  });
})();
</script>
<script src="/gg-header.js" defer></script>
</body>
</html>
